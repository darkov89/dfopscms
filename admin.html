<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFOPSCMS - Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/core/config.js"></script>
    <script defer src="js/core/supabaseClient.js"></script>
    <script defer src="js/templates/registry.js"></script>
    <script defer src="js/core/contentSchema.js"></script>
    <script defer src="js/core/contentUpgrader.js"></script>
    <script defer src="js/core/themeStyling.js"></script>
    <script defer src="js/core/pageRepository.js"></script>
    <script defer src="js/features/adminApp.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col" x-data="createAdminApp()">

    <div x-show="!user && !loadingAuth" class="flex-grow flex items-center justify-center p-6" x-transition>
        <div class="bg-white p-10 rounded-sm shadow-xl border w-full max-w-md">
            <h1 class="text-3xl font-black tracking-widest text-gray-900 text-center mb-2">DFOPS<span class="text-[#D4AF37]">CMS</span></h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest text-center mb-8">Autoryzacja Wymagana</p>
            
            <form @submit.prevent="login" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Adres E-mail</label>
                    <input type="email" x-model="email" required class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Hasło</label>
                    <input type="password" x-model="password" required class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none">
                </div>
                
                <div x-show="authError" class="text-red-500 text-sm font-bold text-center" x-text="authError"></div>

                <button type="submit" class="w-full bg-[#121212] hover:bg-[#D4AF37] hover:text-[#121212] text-white px-8 py-4 rounded-sm text-sm font-bold tracking-widest uppercase transition-all duration-300 shadow-md">
                    Zaloguj się
                </button>
            </form>
        </div>
    </div>

    <div x-show="loadingAuth" class="flex-grow flex items-center justify-center">
        <p class="text-gray-500 tracking-widest text-sm animate-pulse">Weryfikacja tożsamości...</p>
    </div>

    <div x-show="user" style="display: none;" class="flex-grow flex flex-col">
        <header class="bg-white shadow-sm border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50">
            <div>
                <h1 class="text-2xl font-black tracking-widest text-gray-900">DFOPS<span class="text-[#D4AF37]">CMS</span></h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest">Witaj, <span x-text="user?.email"></span></p>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-100 rounded-md overflow-hidden border px-4 py-2">
                    <span class="text-sm text-gray-500 mr-2">Motyw:<span class="ml-2 text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded uppercase tracking-widest" x-text="theme"></span></span>
                    <span class="text-sm font-bold text-[#D4AF37] tracking-wider ml-2" x-text="slug"></span>
                    <a :href="'index.html?site=' + slug" target="_blank" class="ml-4 text-xs font-bold text-blue-500 hover:text-blue-700 uppercase tracking-widest transition-colors">👀 Podgląd na żywo</a>
                </div>

                <button @click="saveData()" x-show="content" class="bg-[#121212] hover:bg-[#D4AF37] hover:text-[#121212] text-white px-8 py-2.5 rounded-sm text-sm font-bold tracking-widest uppercase transition-all duration-300 shadow-lg">
                    <span x-show="!saving">Publikuj Zmiany</span>
                    <span x-show="saving" class="animate-pulse">Zapisywanie...</span>
                </button>
                
                <button @click="logout()" class="text-xs font-bold text-gray-400 hover:text-red-500 uppercase tracking-widest transition-colors">Wyloguj</button>
            </div>
        </header>

        <template x-if="content">
        <main class="max-w-6xl w-full mx-auto mt-8 px-6 pb-24" x-transition.opacity>
            <div x-show="errorMessage" class="mb-6 p-4 bg-red-100 text-red-800 border border-red-200 rounded-sm shadow-sm flex items-center gap-3">
                <span x-text="errorMessage" class="font-medium text-sm"></span>
            </div>

            <div x-show="message" class="mb-6 p-4 bg-green-100 text-green-800 border border-green-200 rounded-sm shadow-sm flex items-center gap-3">
                <span x-text="message" class="font-medium text-sm"></span>
            </div>

            <div x-show="updateAvailable" class="mb-6 p-4 bg-amber-50 text-amber-900 border border-amber-200 rounded-sm shadow-sm flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="text-sm">
                    <div class="font-bold uppercase tracking-widest text-xs mb-1">Dostępna aktualizacja szablonu</div>
                    <div>
                        Twoja wersja: <span class="font-mono font-bold" x-text="currentTemplateVersion"></span>
                        → najnowsza: <span class="font-mono font-bold" x-text="latestTemplateVersion"></span>
                    </div>
                    <div class="text-xs text-amber-700 mt-1">Aktualizacja doda brakujące pola/sekcje. Twoje istniejące wartości pozostaną bez zmian.</div>
                </div>
                <button @click="upgradeTemplate()" :disabled="upgrading"
                        class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-sm text-xs font-bold tracking-widest uppercase transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                    <span x-show="!upgrading">Upgrade do v<span x-text="latestTemplateVersion"></span></span>
                    <span x-show="upgrading" class="animate-pulse">Aktualizuję…</span>
                </button>
            </div>

            <div class="flex flex-col md:flex-row gap-8">
                <div class="md:w-1/4">
                    <div class="bg-white rounded-sm border shadow-sm flex flex-col overflow-hidden sticky top-28">
                        <button @click="activeTab = 'settings'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'settings', 'text-gray-600 hover:bg-gray-50': activeTab !== 'settings'}" class="px-5 py-4 text-left border-b transition-colors text-sm uppercase tracking-wider">Ustawienia Główne</button>
                        <button @click="activeTab = 'hero'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'hero', 'text-gray-600 hover:bg-gray-50': activeTab !== 'hero'}" class="px-5 py-4 text-left border-b transition-colors text-sm uppercase tracking-wider">Sekcja Główna</button>
                        <button @click="activeTab = 'services'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'services', 'text-gray-600 hover:bg-gray-50': activeTab !== 'services'}" class="px-5 py-4 text-left border-b transition-colors text-sm uppercase tracking-wider">Lista Usług</button>
                        <button @click="activeTab = 'gallery'" x-show="theme === 'beauty'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'gallery', 'text-gray-600 hover:bg-gray-50': activeTab !== 'gallery'}" class="px-5 py-4 text-left border-b transition-colors text-sm uppercase tracking-wider flex items-center gap-2">
                            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            Galeria
                        </button>
                        <button @click="activeTab = 'contact'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'contact', 'text-gray-600 hover:bg-gray-50': activeTab !== 'contact'}" class="px-5 py-4 text-left border-b transition-colors text-sm uppercase tracking-wider">Kontakt i Info</button>
                        <button @click="activeTab = 'faq'" x-show="theme === 'consultant' || theme === 'beauty'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'faq', 'text-gray-600 hover:bg-gray-50': activeTab !== 'faq'}" class="px-5 py-4 text-left border-b transition-colors text-sm uppercase tracking-wider">FAQ / Akordeony</button>
                        <button @click="activeTab = 'reviews'" x-show="theme === 'consultant'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'reviews', 'text-gray-600 hover:bg-gray-50': activeTab !== 'reviews'}" class="px-5 py-4 text-left border-b border-gray-100 transition-colors text-sm uppercase tracking-wider">Opinie Klientów</button>
                        <button @click="activeTab = 'seo'" :class="{'bg-gray-50 border-l-4 border-[#D4AF37] font-bold text-gray-900': activeTab === 'seo', 'text-gray-600 hover:bg-gray-50': activeTab !== 'seo'}" class="px-5 py-4 text-left border-t border-gray-200 transition-colors text-sm uppercase tracking-wider">Ustawienia SEO</button>
                    </div>
                </div>

                <div class="md:w-3/4 bg-white rounded-sm border shadow-sm p-8">
                    
                    <div x-show="activeTab === 'settings'" x-transition.opacity>
                        <h2 class="text-2xl font-serif text-gray-900 mb-8 border-b pb-4">Wygląd i Nawigacja</h2>
        
                        <div class="space-y-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Logo (Wersja Tekstowa)</label>
                                <input type="text" x-model="content.pl.nav.logo" class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none">
                                <p class="text-xs text-gray-500 mt-2 leading-relaxed max-w-2xl">Krótka nazwa marki lub podpis w menu — widoczna obok grafiki jako „tekstowe logo”.</p>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-100" x-show="theme === 'beauty'">
                                <h3 class="text-sm font-bold text-gray-900 mb-4 uppercase tracking-widest">Menu (etykiety)</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">O nas</label>
                                        <input type="text" x-model="content.pl.nav.menu.about" class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Cennik</label>
                                        <input type="text" x-model="content.pl.nav.menu.pricing" class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">FAQ</label>
                                        <input type="text" x-model="content.pl.nav.menu.faq" class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Kontakt</label>
                                        <input type="text" x-model="content.pl.nav.menu.contact" class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none">
                                    </div>
                                </div>
                                <p class="text-xs text-gray-500 mt-2 leading-relaxed max-w-2xl">Etykiety linków w górnym menu (np. Cennik, Kontakt). Zmieniają tylko tekst — kolejność sekcji wynika z szablonu.</p>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-100">
                                <h3 class="text-sm font-bold text-gray-900 mb-4 uppercase tracking-widest">Kolory (Preset)</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Preset kolorystyczny</label>
                                        <select x-model="content.pl.settings.color_preset"
                                                @change="applyThemeStylingFromContent()"
                                                class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white">
                                            <template x-for="p in availablePresets" :key="p.id">
                                                <option :value="p.id" x-text="p.label"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="flex items-center justify-between border border-gray-200 rounded-sm px-4 py-3 bg-gray-50">
                                        <div class="text-xs uppercase tracking-widest text-gray-500">Podgląd akcentu</div>
                                        <div class="flex items-center gap-2">
                                            <div class="w-5 h-5 rounded-sm border border-gray-300" :style="`background:${accentColor}`"></div>
                                            <div class="text-xs font-mono text-gray-700" x-text="accentColor"></div>
                                        </div>
                                    </div>
                                </div>
                                <p class="text-xs text-gray-500 mt-2 leading-relaxed max-w-2xl">Gotowa paleta kolorów dopasowana do Twojego motywu. Po publikacji odwiedzący zobaczą ją na żywo.</p>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-100">
                                <h3 class="text-sm font-bold text-gray-900 mb-4 uppercase tracking-widest">Tło i Typografia</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Styl tła</label>
                                        <select x-model="content.pl.settings.background_style"
                                                @change="applyThemeStylingFromContent()"
                                                class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white">
                                            <option value="clean">Clean</option>
                                            <option value="glow">Glow (premium)</option>
                                            <option value="soft">Soft (delikatne)</option>
                                            <option value="smoky">Smoky (barber / luxe)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Fonty</label>
                                        <select x-model="content.pl.settings.font_preset"
                                                @change="applyThemeStylingFromContent()"
                                                class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white">
                                            <option value="inter">Inter + Playfair</option>
                                            <option value="poppins">Poppins + Playfair</option>
                                            <option value="barber">Oswald + Playfair</option>
                                            <option value="elegant">Cormorant + Inter</option>
                                        </select>
                                    </div>
                                </div>
                                <p class="text-xs text-gray-500 mt-2 leading-relaxed max-w-2xl">Charakter tła i para czcionek (nagłówki / tekst). Podgląd w panelu jest natychmiastowy — <strong>Publikuj</strong>, aby zapisać w bazie.</p>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-100">
                                <h3 class="text-sm font-bold text-gray-900 mb-4 uppercase tracking-widest">Gotowe zestawy stylu</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                    <div class="md:col-span-2">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Wybierz zestaw</label>
                                        <select x-model="selectedStyleBundle"
                                                class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white">
                                            <option value="">-- wybierz --</option>
                                            <template x-for="b in styleBundles" :key="b.id">
                                                <option :value="b.id" x-text="b.label"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <button type="button" @click="applyStyleBundle()"
                                            class="bg-[#121212] text-white px-4 py-3 rounded-sm text-xs font-bold uppercase tracking-widest hover:bg-[#2a2a2a] transition-colors">
                                        Zastosuj 1-click
                                    </button>
                                </div>
                                <p class="text-xs text-gray-500 mt-2 leading-relaxed max-w-2xl">Gotowe połączenie koloru, tła i fontów jednym klikiem — potem możesz dopracować szczegóły ręcznie.</p>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-100">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Logo (Plik Graficzny)</label>
                                <div class="flex items-center gap-6">
                                    <div class="flex flex-col items-center shrink-0">
                                        <div class="w-40 h-16 rounded-sm border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden bg-gray-100 p-2">
                                            <template x-if="content.pl.nav.logoImage">
                                                <img :src="content.pl.nav.logoImage" class="w-full h-full object-contain mix-blend-multiply">
                                            </template>
                                            <template x-if="!content.pl.nav.logoImage">
                                                <span class="text-[10px] text-gray-500 uppercase tracking-widest text-center">Brak Pliku</span>
                                            </template>
                                        </div>
                                        <template x-if="content.pl.nav.logoImage">
                                            <button @click="content.pl.nav.logoImage = ''" type="button" class="mt-2 text-[10px] text-red-500 hover:text-red-700 font-bold uppercase tracking-widest">✖ Usuń grafikę</button>
                                        </template>
                                    </div>
                                    <div class="flex-grow">
                                        <input type="file" accept="image/*" @change="uploadImage($event, 'nav', 'logoImage')" class="text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-sm file:border-0 file:text-xs file:font-bold file:uppercase file:tracking-widest file:bg-[#121212] file:text-[#D4AF37] hover:file:bg-gray-800 cursor-pointer transition-colors w-full">
                                        <p class="text-xs text-gray-500 mt-2 leading-relaxed">PNG lub SVG z przezroczystym tłem działają najlepiej. Po wgraniu kliknij <strong>Publikuj Zmiany</strong>.</p>
                                        <p x-show="uploadingImage" class="text-xs text-[#D4AF37] mt-2 font-bold animate-pulse">Wysyłanie na serwer...</p>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-100" x-show="theme === 'consultant'">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <div class="relative">
                                        <input type="checkbox" x-model="content.pl.settings.darkMode" class="sr-only peer">
                                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#D4AF37]"></div>
                                    </div>
                                    <span class="text-sm font-bold text-gray-700 uppercase tracking-widest">Tryb Ciemny (Dark Mode)</span>
                                </label>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-100" x-show="theme === 'consultant'">
                                <h3 class="text-sm font-bold text-gray-900 mb-4 uppercase tracking-widest">Widoczność Sekcji (Consultant)</h3>
                                <div class="space-y-4">
                                    <label class="flex items-center gap-3 cursor-pointer">
                                        <div class="relative"><input type="checkbox" x-model="content.pl.settings.showManifesto" class="sr-only peer"><div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#D4AF37]"></div></div>
                                        <span class="text-sm font-bold text-gray-700">Sekcja: Manifesto / O mnie</span>
                                    </label>
                                    <label class="flex items-center gap-3 cursor-pointer">
                                        <div class="relative"><input type="checkbox" x-model="content.pl.settings.showServices" class="sr-only peer"><div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#D4AF37]"></div></div>
                                        <span class="text-sm font-bold text-gray-700">Sekcja: Usługi</span>
                                    </label>
                                    <label class="flex items-center gap-3 cursor-pointer">
                                        <div class="relative"><input type="checkbox" x-model="content.pl.settings.showProof" class="sr-only peer"><div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#D4AF37]"></div></div>
                                        <span class="text-sm font-bold text-gray-700">Sekcja: Proof / Statystyka</span>
                                    </label>
                                    <label class="flex items-center gap-3 cursor-pointer">
                                        <div class="relative"><input type="checkbox" x-model="content.pl.settings.showFaq" class="sr-only peer"><div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#D4AF37]"></div></div>
                                        <span class="text-sm font-bold text-gray-700">Sekcja: FAQ</span>
                                    </label>
                                    <label class="flex items-center gap-3 cursor-pointer">
                                        <div class="relative"><input type="checkbox" x-model="content.pl.settings.showReviews" class="sr-only peer"><div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#D4AF37]"></div></div>
                                        <span class="text-sm font-bold text-gray-700">Sekcja: Opinie</span>
                                    </label>
                                    <label class="flex items-center gap-3 cursor-pointer">

                                    <div class="mb-4">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Pytanie</label>
                                        <input type="text" x-model="item.question" class="w-full border border-gray-300 rounded-sm px-4 py-2 font-bold focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Odpowiedź</label>
                                        <textarea x-model="item.answer" rows="3" class="w-full border border-gray-300 rounded-sm px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white resize-y"></textarea>
                                    </div>
                                </div>
                            </template>
                            <button @click="content.pl.faq.push({question: 'Nowe pytanie?', answer: 'Odpowiedź...'})" class="w-full border-2 border-dashed border-gray-300 text-gray-500 font-bold uppercase tracking-widest py-4 rounded-sm hover:bg-[#D4AF37] hover:text-white transition-all">
                                + Dodaj pytanie
                            </button>
                        </div>
                    </div>

                    <div x-show="activeTab === 'reviews'" x-transition.opacity style="display: none;">
                        <h2 class="text-2xl font-serif text-gray-900 mb-8 border-b pb-4">Opinie Klientów</h2>
                        <div class="space-y-6">
                            <template x-for="(review, index) in content.pl.reviews" :key="index">
                                <div class="bg-gray-50 p-6 rounded-sm border relative group mb-4">
                                    <button @click="content.pl.reviews.splice(index, 1)" class="absolute top-4 right-4 text-red-400 hover:text-red-600 text-xs font-bold uppercase">Usuń</button>
                                    <div class="mb-4">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Autor Opinii</label>
                                        <input type="text" x-model="review.author" class="w-full border border-gray-300 rounded-sm px-4 py-2 font-bold focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white">
                                    </div>
                                    <div class="mb-4">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Treść Opinii</label>
                                        <textarea x-model="review.content" rows="3" class="w-full border border-gray-300 rounded-sm px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white resize-y"></textarea>
                                    </div>
                                    <div class="mt-4 pt-4 border-t border-gray-200" x-show="theme === 'consultant'">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Logo klienta (opcjonalnie)</label>
                                        <div class="flex items-start gap-4">
                                            <div class="flex flex-col items-center shrink-0">
                                                <div class="w-20 h-12 rounded-sm border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden bg-gray-50 p-1">
                                                    <template x-if="review.logoImage">
                                                        <img :src="review.logoImage" class="w-full h-full object-contain">
                                                    </template>
                                                    <template x-if="!review.logoImage">
                                                        <span class="text-[10px] text-gray-400 uppercase tracking-widest text-center">Brak</span>
                                                    </template>
                                                </div>
                                                <template x-if="review.logoImage">
                                                    <button @click="review.logoImage = ''" type="button" class="mt-2 text-[10px] text-red-500 hover:text-red-700 font-bold uppercase tracking-widest">✖ Usuń grafikę</button>
                                                </template>
                                            </div>
                                            <input type="file" accept="image/*" @change="uploadImage($event, 'reviews', 'logoImage', index)" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-3 file:rounded-sm file:border-0 file:text-xs file:font-bold file:uppercase file:tracking-widest file:bg-[#121212] file:text-[#D4AF37] hover:file:bg-gray-800 cursor-pointer">
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <button @click="content.pl.reviews.push({author: 'Imię Nazwisko', content: 'Treść opinii...', logoImage: ''})" class="w-full border-2 border-dashed border-gray-300 text-gray-500 font-bold uppercase tracking-widest py-4 rounded-sm hover:bg-[#D4AF37] hover:text-white transition-all">
                                + Dodaj opinię
                            </button>
                        </div>
                    </div>

                    <div x-show="activeTab === 'seo'" x-transition.opacity style="display: none;">
                        <div class="rounded-sm border border-gray-200 bg-gradient-to-br from-amber-50/40 via-white to-gray-50/80 p-1 mb-8">
                            <div class="bg-white/90 backdrop-blur-sm rounded-sm px-6 py-5 border border-gray-100">
                                <h2 class="text-2xl font-serif text-gray-900 border-b border-gray-100 pb-4 mb-1">Widoczność w Google i sieciach społecznościowych</h2>
                                <p class="text-sm text-gray-600 leading-relaxed mt-3 max-w-3xl">Ustaw tytuł i opis strony oraz grafikę udostępnień. Te dane trafiają do znaczników meta na publicznej stronie (po wdrożeniu w szablonie).</p>
                            </div>
                        </div>

                        <div class="space-y-8 max-w-3xl">
                            <div class="bg-gray-50/80 rounded-sm border border-gray-100 p-6">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Meta Title</label>
                                <input type="text" x-model="content.pl.seo.title" maxlength="120"
                                       class="w-full border border-gray-300 rounded-sm px-4 py-3 focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white">
                                <p class="text-xs text-gray-500 mt-2 leading-relaxed">Tytuł wyświetlany w Google i na karcie przeglądarki. Zalecane max 60 znaków.</p>
                            </div>

                            <div class="bg-gray-50/80 rounded-sm border border-gray-100 p-6">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Meta Description</label>
                                <textarea x-model="content.pl.seo.description" rows="3" maxlength="320"
                                          class="w-full border border-gray-300 rounded-sm px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all outline-none bg-white resize-y min-h-[5rem]"></textarea>
                                <p class="text-xs text-gray-500 mt-2 leading-relaxed">Krótki opis Twojej strony zachęcający do kliknięcia. Zalecane max 160 znaków.</p>
                            </div>

                            <div class="bg-gray-50/80 rounded-sm border border-gray-100 p-6">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Obrazek Social Media (Open Graph)</label>
                                <p class="text-xs text-gray-500 mb-4 leading-relaxed">Ten obrazek wyświetli się, gdy ktoś udostępni link do Twojej strony na Facebooku, LinkedIn lub w wiadomości.</p>
                                <div class="flex flex-col sm:flex-row items-start gap-6">
                                    <div class="flex flex-col items-center shrink-0">
                                        <div class="w-40 h-[5.5rem] rounded-sm border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden bg-white p-2">
                                            <template x-if="content.pl.seo.ogImage">
                                                <img :src="content.pl.seo.ogImage" class="w-full h-full object-cover rounded-sm" alt="Podgląd OG">
                                            </template>
                                            <template x-if="!content.pl.seo.ogImage">
                                                <span class="text-[10px] text-gray-500 uppercase tracking-widest text-center px-2">Brak grafiki</span>
                                            </template>
                                        </div>
                                        <template x-if="content.pl.seo.ogImage">
                                            <button type="button" @click="content.pl.seo.ogImage = ''"
                                                    class="mt-2 text-[10px] text-red-500 hover:text-red-700 font-bold uppercase tracking-widest">✖ Usuń grafikę</button>
                                        </template>
                                    </div>
                                    <div class="flex-grow w-full min-w-0">
                                        <input type="file" accept="image/*" @change="uploadImage($event, 'seo', 'ogImage')"
                                               class="text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-sm file:border-0 file:text-xs file:font-bold file:uppercase file:tracking-widest file:bg-[#121212] file:text-[#D4AF37] hover:file:bg-gray-800 cursor-pointer transition-colors w-full">
                                        <p class="text-xs text-gray-500 mt-3 leading-relaxed">Zalecany format 1200×630 px lub zbliżony (JPG/PNG). Po wgraniu kliknij <strong>Publikuj Zmiany</strong>.</p>
                                        <p x-show="uploadingImage" class="text-xs text-[#D4AF37] mt-2 font-bold animate-pulse">Wysyłanie na serwer...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
        </template>
    </div>

</body>
</html>
