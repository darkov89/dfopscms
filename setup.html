<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona w budowie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/core/config.js"></script>
    <script defer src="js/core/supabaseClient.js"></script>
    <script defer src="js/templates/registry.js"></script>
    <script defer src="js/core/contentSchema.js"></script>
    <script defer src="js/core/contentUpgrader.js"></script>
    <script defer src="js/core/themeStyling.js"></script>
    <script defer src="js/core/pageRepository.js"></script>
    <script defer src="js/core/planUtils.js"></script>
    <script defer src="js/features/publicSiteApp.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body
    class="min-h-screen bg-[#0b0b0f] text-zinc-100 antialiased"
    x-data="createPublicSiteApp('setup')"
    x-cloak
>

    <div x-show="!dataLoaded && !bazaBlad" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0b0b0f]">
        <div class="h-12 w-12 rounded-full border-2 border-[#D4AF37] border-t-transparent animate-spin mb-4"></div>
        <p class="text-sm font-medium tracking-[0.2em] text-[#D4AF37]/80 uppercase">Ładowanie…</p>
    </div>

    <div x-show="bazaBlad" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0b0b0f] px-6 text-center">
        <p class="text-zinc-400">Nie udało się wczytać strony.</p>
    </div>

    <div x-show="trialBlocked && dataLoaded" x-cloak class="fixed inset-0 z-[250] flex flex-col items-center justify-center bg-[#0b0b0f]/98 px-6 text-center text-zinc-200">
        <div class="max-w-lg rounded-xl border border-[#D4AF37]/40 bg-[#121212] p-8 shadow-2xl">
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#D4AF37] mb-3">DFCMS</p>
            <h1 class="text-2xl font-bold text-white mb-4" x-text="trialBlockedTitle"></h1>
            <p class="text-sm text-zinc-400 leading-relaxed mb-4" x-text="trialBlockedBody"></p>
            <p x-show="trialBlockedAdminHint" x-cloak class="text-sm text-zinc-200 font-medium leading-relaxed mb-8 border-l-4 border-[#D4AF37] pl-4 text-left" x-text="trialBlockedAdminHint"></p>
            <div class="flex flex-col gap-3">
                <a :href="subscriptionPanelUrl" class="inline-flex justify-center rounded-sm bg-[#D4AF37] px-6 py-3 text-sm font-bold uppercase tracking-widest text-[#121212] hover:opacity-90 transition-opacity">Zaloguj do panelu administratora</a>
                <a :href="landingPricingUrl" class="inline-flex justify-center rounded-sm border-2 border-[#D4AF37] px-6 py-3 text-sm font-bold uppercase tracking-widest text-[#D4AF37] hover:bg-[#D4AF37]/10 transition-colors">Zobacz cennik</a>
            </div>
        </div>
    </div>

    <template x-if="dataLoaded && !trialBlocked && content && content.pl && theme === 'setup'">
        <div class="min-h-screen flex flex-col items-center justify-center px-6 py-16 text-center">
            <p class="text-xs font-bold uppercase tracking-[0.25em] text-[#D4AF37]/90 mb-4">DFCMS</p>
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-4 tracking-tight">Strona w budowie</h1>
            <p class="text-lg text-zinc-400 max-w-lg mb-10 leading-relaxed">
                Trwa konfiguracja serwisu <span class="text-[#D4AF37] font-semibold" x-text="slug"></span>. Zapraszamy wkrótce!
            </p>
            <a
                :href="'admin.html?site=' + encodeURIComponent(slug || '')"
                class="inline-flex items-center justify-center rounded-sm bg-[#D4AF37] px-8 py-4 text-sm font-bold uppercase tracking-widest text-[#121212] shadow-lg shadow-[#D4AF37]/20 transition hover:bg-[#c9a432]"
            >
                Zaloguj do panelu
            </a>
        </div>
    </template>

</body>
</html>
