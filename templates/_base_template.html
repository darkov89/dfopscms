<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFCMS — nowy szablon branżowy</title>
    <meta name="description" content="Boilerplate nowego szablonu branżowego DFCMS.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'ui-serif', 'Georgia', 'serif'],
                    },
                    colors: {
                        brand: {
                            ink: '#121212',
                            gold: '#D4AF37',
                        },
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="/css/styles.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="/js/core/utils.js?v=20260617a"></script>
    <script defer src="/js/core/config.js?v=20260602b"></script>
    <script defer src="/js/core/supabaseClient.js"></script>
    <script defer src="/js/templates/registry.js?v=20260622a"></script>
    <script defer src="/js/core/contentSchema.js"></script>
    <script defer src="/js/core/contentUpgrader.js?v=20260622a"></script>
    <script defer src="/js/core/themeStyling.js"></script>
    <script defer src="/js/core/pageRepository.js?v=20260622b"></script>
    <script defer src="/js/core/planUtils.js?v=20260602b"></script>
    <script defer src="/js/features/publicSiteApp.js?v=20260622a"></script>
    <script defer src="/js/features/googleReviewsApp.js"></script>
    <script defer src="/js/features/cookieConsentApp.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-white font-sans text-slate-900 antialiased" x-data="createPublicSiteApp('beauty')">
    <div x-show="!dataLoaded && !bazaBlad" class="fixed inset-0 z-50 grid place-items-center bg-white">
        <p class="text-sm font-semibold uppercase tracking-widest text-slate-500">Ładowanie strony...</p>
    </div>

    <header class="border-b border-slate-200 bg-white/90 backdrop-blur">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
            <a href="#top" class="text-lg font-bold" x-text="content[lang]?.nav?.logo || 'Nazwa firmy'"></a>
            <nav class="hidden items-center gap-6 text-sm font-medium text-slate-600 md:flex">
                <a href="#oferta" class="hover:text-brand-gold">Oferta</a>
                <a href="#opinie" class="hover:text-brand-gold">Opinie</a>
                <a href="#kontakt" class="hover:text-brand-gold">Kontakt</a>
            </nav>
        </div>
    </header>

    <main id="top">
        <section class="mx-auto grid max-w-6xl gap-10 px-6 py-20 md:grid-cols-[1.1fr_0.9fr] md:items-center">
            <div>
                <p class="mb-4 text-xs font-bold uppercase tracking-[0.3em] text-brand-gold">Nowy szablon</p>
                <h1 class="font-serif text-4xl font-semibold leading-tight md:text-6xl" x-html="DFOPS_pageRepository.sanitizeHtml(content[lang]?.hero?.headline || 'Nagłówek strony')"></h1>
                <p class="mt-6 max-w-2xl text-lg leading-relaxed text-slate-600" x-text="content[lang]?.hero?.description || 'Krótki opis wartości dla klienta.'"></p>
                <a href="#kontakt" class="mt-8 inline-flex rounded-full bg-brand-ink px-6 py-3 text-sm font-bold uppercase tracking-widest text-white transition hover:bg-brand-gold hover:text-brand-ink">Skontaktuj się</a>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-slate-50 p-8 text-center text-slate-400">
                Placeholder hero / zdjęcie
            </div>
        </section>

        <section id="oferta" class="border-y border-slate-200 bg-slate-50 px-6 py-20">
            <div class="mx-auto max-w-6xl">
                <h2 class="text-3xl font-bold">Oferta</h2>
                <div class="mt-8 grid gap-5 md:grid-cols-3">
                    <article class="rounded-2xl border border-slate-200 bg-white p-6">Karta usługi</article>
                    <article class="rounded-2xl border border-slate-200 bg-white p-6">Karta usługi</article>
                    <article class="rounded-2xl border border-slate-200 bg-white p-6">Karta usługi</article>
                </div>
            </div>
        </section>
    </main>

    <footer id="kontakt" class="bg-brand-ink px-6 py-12 text-white">
        <div class="mx-auto max-w-6xl">
            <p class="font-bold" x-text="content[lang]?.hero?.name || content[lang]?.nav?.logo || 'Nazwa firmy'"></p>
            <p class="mt-2 text-sm text-white/60">Stopka nowego szablonu branżowego.</p>
        </div>
    </footer>
</body>
</html>
