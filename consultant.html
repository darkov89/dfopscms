<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona konsultanta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@300;400;500;600&family=Oswald:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#121212',
                            gold: '#D4AF37',
                            gray: '#2A2A2A',
                            text: '#E0E0E0'
                        }
                    },
                    fontFamily: {
                        // ZMIANA: Wszędzie używamy 'Inter' (Tech vibe)
                        serif: ['"Inter"', 'sans-serif'], 
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="js/core/config.js"></script>
    <script defer src="js/core/supabaseClient.js"></script>
    <script defer src="js/templates/registry.js"></script>
    <script defer src="js/core/contentSchema.js"></script>
    <script defer src="js/core/contentUpgrader.js"></script>
    <script defer src="js/core/themeStyling.js"></script>
    <script defer src="js/core/pageRepository.js"></script>
    <script defer src="js/features/publicSiteApp.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <script src="js/ui/reveal.js" defer></script>
</head>

<body 
    :class="content && content[lang].settings?.darkMode ? 'dark' : ''"
    class="bg-zinc-50 text-gray-900 dark:bg-brand-dark dark:text-brand-text font-sans antialiased selection:bg-brand-gold selection:text-brand-dark transition-colors duration-500"
    x-data="createPublicSiteApp('consultant')"
>

    <div x-show="!content" class="fixed inset-0 bg-zinc-50 dark:bg-brand-dark z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <svg class="animate-spin h-10 w-10 text-brand-gold mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-brand-gold font-serif tracking-widest text-sm animate-pulse">DISTILLING ESSENCE...</p>
    </div>

    <div x-show="bazaBlad" class="fixed inset-0 bg-zinc-50 dark:bg-brand-dark z-[100] flex flex-col items-center justify-center text-center px-6" style="display: none;">
        <h1 class="text-6xl text-brand-gold font-serif mb-4">404</h1>
        <p class="text-xl text-gray-400">Nie znaleziono danych dla tej strony.</p>
    </div>

    <template x-if="content">
        <div x-transition.opacity.duration.700ms>
        
        <nav class="fixed w-full z-50 bg-white/80 dark:bg-brand-dark/90 backdrop-blur-md border-b border-gray-100 dark:border-white/5 py-4 transition-all duration-300">
            <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
                <div class="flex items-center">
                     <template x-if="content[lang].nav?.logoImage">
                        <img :src="content[lang].nav.logoImage" alt="Logo" class="h-8 md:h-12 object-contain">
                     </template>
    
                    <template x-if="!content[lang].nav?.logoImage">
                        <div class="text-lg md:text-xl font-sans font-bold tracking-[0.15em] uppercase text-gray-900 dark:text-white" x-html="content[lang].nav.logo || 'MOJA <span class=\'text-brand-gold\'>FIRMA</span>'"></div>
                    </template>
                </div>                
                <div class="flex items-center gap-6">
                    <template x-if="content[lang].social?.linkedin">
                        <a :href="content[lang].social.linkedin" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-brand-gold transition-colors">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                                <rect x="2" y="9" width="4" height="12"></rect>
                                <circle cx="4" cy="4" r="2"></circle>
                            </svg>
                        </a>
                    </template>

                    <template x-if="Object.keys(content).length > 1">
                        <div class="flex items-center gap-6">
                            <div class="h-4 w-px bg-gray-700"></div> 
                            <div class="flex space-x-3 text-xs uppercase tracking-widest">
                                <template x-for="(langKey, index) in Object.keys(content)" :key="langKey">
                                    <div class="flex items-center space-x-3">
                                        <button @click="lang = langKey" :class="lang === langKey ? 'text-brand-gold font-bold scale-110' : 'text-gray-600 hover:text-white transition-all'" x-text="langKey"></button>
                                        <span class="text-gray-800" x-show="index < Object.keys(content).length - 1">|</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <a href="#contact" class="hidden md:block text-sm uppercase tracking-widest text-brand-gold hover:text-white transition-colors duration-300" x-text="content[lang].nav?.cta"></a>
                </div>
            </div>
        </nav>

       <header class="min-h-screen flex flex-col justify-center items-center text-center px-6 relative overflow-hidden pt-24">
            
            <div class="mb-6 reveal relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-brand-gold to-brand-dark rounded-full opacity-30 group-hover:opacity-60 blur transition duration-500"></div>
               <template x-if="content[lang].hero?.image">
                    <img 
                        :src="content[lang].hero.image" 
                        alt="Zdjęcie profilowe" 
                        class="relative w-40 h-40 md:w-48 md:h-48 object-cover object-top rounded-full border-2 border-brand-gold/30 grayscale hover:grayscale-0 transition-all duration-700 shadow-2xl"
                    >
               </template>
               <template x-if="!content[lang].hero?.image">
                    <div class="relative w-40 h-40 md:w-48 md:h-48 rounded-full border-2 border-brand-gold/30 bg-white/10 dark:bg-white/5 flex items-center justify-center shadow-2xl">
                        <span class="text-brand-gold font-serif text-3xl tracking-widest" x-text="(content[lang].hero?.name || 'JA').trim().slice(0,2).toUpperCase()"></span>
                    </div>
               </template>
            </div>

            <h3 class="font-serif text-xl md:text-2xl text-brand-gold tracking-widest uppercase mb-6 reveal delay-100" x-text="content[lang].hero.name"></h3>

            <h1 class="font-serif text-4xl md:text-6xl lg:text-7xl leading-tight text-gray-900 dark:text-white max-w-4xl mb-6 reveal delay-200" x-html="content[lang].hero.headline"></h1>
            <p class="font-serif text-xl md:text-2xl text-gray-400 mb-4 reveal delay-300" x-text="content[lang].hero.subheadline"></p>
            <p class="max-w-2xl text-base md:text-lg text-gray-500 mb-10 font-light reveal delay-500" x-text="content[lang].hero.description"></p>
            
            <a href="#contact" class="group relative px-8 py-3 border border-brand-gold text-brand-gold font-serif text-lg tracking-wide hover:bg-brand-gold hover:text-brand-dark transition-all duration-300 reveal delay-500" x-text="content[lang].hero.button"></a>
        </header>

 <section class="py-24 px-6 bg-zinc-50 dark:bg-[#0f0f0f]" x-show="content[lang].settings?.showManifesto !== false">
    <div class="max-w-3xl mx-auto reveal">
        
        <div class="text-center mb-12">
            <span class="text-xs uppercase tracking-[0.2em] text-gray-500 mb-4 block" x-text="content && content[lang].manifesto?.label"></span>
            <h2 class="text-3xl md:text-4xl text-gray-900 dark:text-white font-bold tracking-tight" x-text="content && content[lang].manifesto?.title"></h2>
            <div class="h-px w-24 bg-brand-gold mx-auto mt-6"></div>
        </div>

        <div class="px-2 md:px-8">
            <p class="text-lg md:text-xl text-gray-600 dark:text-gray-300 leading-relaxed text-left font-light" 
               x-html="content && content[lang].manifesto?.text">
            </p>
        </div>

    </div>
</section>

        <section class="py-24 px-6 relative" x-show="content[lang].settings?.showServices !== false">
            <div class="max-w-6xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <template x-for="(service, index) in content[lang].services">
                        <div class="service-card reveal border border-gray-100 dark:border-white/10 p-8 hover:border-brand-gold/50 transition-all duration-500 bg-white dark:bg-white/5 flex flex-col shadow-xl hover:-translate-y-1" :class="'delay-' + (index * 100)">
                            <div class="text-brand-gold mb-4">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                            </div>
                            <h3 class="font-serif text-2xl text-gray-900 dark:text-white mb-4" x-text="service.title"></h3>
                            <p class="text-gray-500 dark:text-gray-400 font-light flex-grow" x-text="service.desc"></p>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <section class="py-24 px-6 bg-white dark:bg-[#0f0f0f]" x-show="content[lang].settings?.showProof !== false && content[lang].proof">
            <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-12">
                <div class="md:w-1/2 reveal">
                    <span class="text-xs uppercase tracking-[0.2em] text-brand-gold mb-2 block" x-text="content[lang].proof?.label"></span>
                    <h2 class="font-serif text-3xl md:text-4xl text-gray-900 dark:text-white mb-6" x-text="content[lang].proof?.title"></h2>
                    <p class="text-gray-600 dark:text-gray-400 leading-relaxed mb-6 font-light" x-text="content[lang].proof?.text"></p>
                </div>
                <div class="md:w-1/2 w-full reveal">
                    <div class="bg-zinc-50 dark:bg-brand-gray/30 p-8 border-l-2 border-brand-gold shadow-lg">
                        <span class="block text-5xl md:text-6xl font-serif text-gray-900 dark:text-white mb-2" x-text="content[lang].proof?.statNumber"></span>
                        <span class="text-lg text-brand-gold uppercase tracking-wider mb-4 block" x-text="content[lang].proof?.statLabel"></span>
                        <p class="text-gray-500 dark:text-gray-400 text-sm italic" x-text="content[lang].proof?.statDesc"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- FAQ Section -->
        <section class="py-24 px-6 relative" x-show="content[lang].settings?.showFaq !== false && content[lang].faq && content[lang].faq.length > 0">
            <div class="max-w-3xl mx-auto">
                <div class="text-center mb-16 reveal">
                    <span class="text-xs uppercase tracking-[0.2em] text-brand-gold mb-4 block">Częste pytania</span>
                    <h2 class="text-4xl font-serif text-gray-900 dark:text-white">FAQ / Q&A</h2>
                </div>
                
                <div class="space-y-4">
                    <template x-for="(item, index) in content[lang].faq" :key="index">
                        <div class="reveal border border-gray-100 dark:border-white/10 bg-white dark:bg-white/5 overflow-hidden shadow-lg" x-data="{ expanded: false }">
                            <button @click="expanded = !expanded" class="w-full px-8 py-6 flex justify-between items-center text-left hover:bg-zinc-50 dark:hover:bg-white/10 transition-colors">
                                <span class="font-bold text-gray-900 dark:text-white text-lg" x-text="item.question"></span>
                                <svg class="w-5 h-5 text-brand-gold transform transition-transform duration-300" :class="expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div x-show="expanded" x-collapse x-cloak>
                                <div class="px-8 pb-6 text-gray-600 dark:text-gray-400 leading-relaxed" x-text="item.answer"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="py-24 px-6 bg-zinc-50 dark:bg-[#0f0f0f]" x-show="content[lang].settings?.showReviews !== false && content[lang].reviews && content[lang].reviews.length > 0">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-16 reveal">
                    <span class="text-xs uppercase tracking-[0.2em] text-brand-gold mb-4 block">Głos Klientów</span>
                    <h2 class="text-4xl font-serif text-gray-900 dark:text-white">Opinie i Współpraca</h2>
                </div>

                <div x-data="{ idx: 0, timer: null, init(){ if ((content[lang].reviews || []).length > 1) { this.timer = setInterval(() => { this.idx = (this.idx + 1) % content[lang].reviews.length }, 4500); } } }"
                     class="relative overflow-hidden">
                    <div class="flex transition-transform duration-700 ease-in-out"
                         :style="`transform: translateX(-${idx * 100}%);`">
                        <template x-for="(review, index) in content[lang].reviews" :key="index">
                            <div class="w-full shrink-0 px-2 md:px-8">
                                <div class="reveal bg-white dark:bg-[#121212] p-8 border border-gray-100 dark:border-white/5 flex flex-col shadow-xl min-h-[290px]">
                                    <div class="mb-6">
                                        <div class="h-16 w-full max-w-[220px] rounded-sm border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 flex items-center justify-center overflow-hidden px-3">
                                            <template x-if="review.logoImage">
                                                <img :src="review.logoImage" class="max-h-12 w-full object-contain opacity-95">
                                            </template>
                                            <template x-if="!review.logoImage">
                                                <span class="text-[10px] uppercase tracking-[0.2em] text-gray-400">Logo Klienta</span>
                                            </template>
                                        </div>
                                    </div>
                                    <p class="text-gray-600 dark:text-gray-400 font-light italic mb-8 flex-grow text-lg leading-relaxed" x-text="'„' + review.content + '”'"></p>
                                    <div class="flex items-center gap-4">
                                        <div class="h-px w-8 bg-brand-gold"></div>
                                        <span class="text-sm font-bold uppercase tracking-widest text-gray-900 dark:text-white" x-text="review.author"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="flex justify-center mt-6 gap-2" x-show="(content[lang].reviews || []).length > 1">
                        <template x-for="(dot, dotIndex) in content[lang].reviews" :key="dotIndex">
                            <button class="w-2.5 h-2.5 rounded-full transition-colors"
                                    :class="idx === dotIndex ? 'bg-brand-gold' : 'bg-gray-300 dark:bg-gray-600'"
                                    @click="idx = dotIndex"></button>
                        </template>
                    </div>
                </div>
            </div>
        </section>

        <!-- Google Reviews (Zaufanie) — nad kontaktem, karuzela -->
        <template x-if="content[lang].google_reviews?.place_query">
            <section class="py-24 px-4 sm:px-6 bg-white dark:bg-[#0f0f0f] overflow-hidden">
                <div class="max-w-5xl mx-auto">
                    <div class="text-center mb-10 reveal">
                        <span class="text-xs uppercase tracking-[0.2em] text-brand-gold mb-4 block">Zaufanie</span>
                        <h2 class="text-4xl font-serif text-gray-900 dark:text-white" x-text="content[lang].google_reviews?.title || 'Opinie z Google'"></h2>
                    </div>

                    <div
                        x-data="{
                            loading: true,
                            reviews: [],
                            error: '',
                            slide: 0,
                            placeId: '',
                            placeRating: null,
                            userRatingCount: null,
                            avgFromReviews() {
                                if (!this.reviews.length) return null;
                                const sum = this.reviews.reduce((a, r) => a + (Number(r.rating) || 0), 0);
                                return Math.round((sum / this.reviews.length) * 10) / 10;
                            },
                            headerRating() {
                                const pr = this.placeRating != null && !Number.isNaN(Number(this.placeRating)) ? Number(this.placeRating) : null;
                                return pr != null ? pr : this.avgFromReviews();
                            },
                            displayCount() {
                                if (this.userRatingCount != null && this.userRatingCount > 0) return this.userRatingCount;
                                return this.reviews.length;
                            },
                            writeReviewUrl() {
                                if (!this.placeId) return 'https://www.google.com/maps';
                                return 'https://search.google.com/local/writereview?placeid=' + encodeURIComponent(this.placeId);
                            },
                            formatRel(iso, L) {
                                if (!iso) return '';
                                const d = new Date(iso);
                                if (Number.isNaN(d.getTime())) return '';
                                const pl = L !== 'en';
                                const days = Math.floor((Date.now() - d.getTime()) / 86400000);
                                if (days <= 0) return pl ? 'Dzisiaj' : 'Today';
                                if (days === 1) return pl ? 'Wczoraj' : 'Yesterday';
                                if (days < 7) return pl ? (days + ' dni temu') : (days + ' days ago');
                                return d.toLocaleDateString(pl ? 'pl-PL' : 'en-US', { day: 'numeric', month: 'short' });
                            },
                            prevSlide() { this.slide = Math.max(0, this.slide - 1); },
                            nextSlide() { this.slide = Math.min(Math.max(0, this.reviews.length - 1), this.slide + 1); },
                            async fetchReviews() {
                                this.loading = true;
                                this.reviews = [];
                                this.error = '';
                                this.slide = 0;
                                let failSafeId = null;
                                let timeoutId = null;
                                try {
                                    failSafeId = setTimeout(() => { this.loading = false; this.error = 'Timeout pobierania opinii.'; }, 25000);
                                    const controller = new AbortController();
                                    timeoutId = setTimeout(() => controller.abort(), 12000);
                                    const fnUrl = (window.DFOPS_CONFIG?.supabaseUrl
                                        ? window.DFOPS_CONFIG.supabaseUrl + '/functions/v1/get-google-reviews'
                                        : '/functions/v1/get-google-reviews');
                                    const resp = await fetch(fnUrl, {
                                        method: 'POST',
                                        headers: {
                                            'content-type': 'application/json',
                                            'authorization': 'Bearer ' + (window.DFOPS_CONFIG?.supabaseAnonKey || '')
                                        },
                                        signal: controller.signal,
                                        body: JSON.stringify({
                                            query: content[lang].google_reviews.place_query,
                                            maxReviews: content[lang].google_reviews.max_reviews || 8
                                        })
                                    });
                                    if (timeoutId) clearTimeout(timeoutId);
                                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                                    const json = await resp.json();
                                    this.placeId = json?.placeId || '';
                                    this.placeRating = json?.placeRating ?? null;
                                    this.userRatingCount = json?.userRatingCount ?? null;
                                    this.reviews = json?.reviews || [];
                                    this.error = json?.error || '';
                                } catch (e) {
                                    this.error = e?.message || 'Błąd pobierania opinii.';
                                } finally {
                                    if (failSafeId) clearTimeout(failSafeId);
                                    this.loading = false;
                                }
                            }
                        }"
                        x-init="fetchReviews()"
                        class="reveal"
                    >
                        <template x-if="loading">
                            <div class="bg-white dark:bg-[#121212] border border-gray-200 dark:border-white/10 rounded-full sm:rounded-2xl shadow-xl p-8 text-center">
                                <div class="text-gray-600 dark:text-gray-300 text-sm font-bold">Ładowanie opinii z Google…</div>
                            </div>
                        </template>

                        <template x-if="!loading && reviews.length">
                            <div class="space-y-8">
                                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 px-5 sm:px-8 py-4 rounded-full border border-brand-gold/30 bg-white/90 dark:bg-[#121212]/90 dark:border-white/10 shadow-lg backdrop-blur-sm">
                                    <div class="flex flex-wrap items-center gap-3 sm:gap-4 justify-center sm:justify-start">
                                        <svg class="h-7 w-7 shrink-0" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.666 32.657 29.234 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.222 0-9.673-3.453-11.284-8.091l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
                                        <span class="text-sm font-semibold text-gray-900 dark:text-white tracking-wide" x-text="$root.lang === 'en' ? 'Google reviews' : 'Opinie Google'"></span>
                                        <div class="flex items-center gap-1 text-brand-gold text-base leading-none" aria-hidden="true">
                                            <template x-for="si in [1,2,3,4,5]" :key="'h'+si">
                                                <span x-text="si <= Math.round(headerRating() || 0) ? '★' : '☆'"></span>
                                            </template>
                                        </div>
                                        <span class="text-sm font-bold text-gray-900 dark:text-white tabular-nums" x-text="headerRating() != null ? Number(headerRating()).toFixed(1) : '—'"></span>
                                        <span class="text-gray-400 dark:text-gray-600">|</span>
                                        <span class="text-sm text-gray-500 dark:text-gray-400" x-text="displayCount() + ' ' + ($root.lang === 'en' ? 'reviews' : 'opinii')"></span>
                                    </div>
                                    <a :href="writeReviewUrl()" target="_blank" rel="noopener noreferrer"
                                       class="shrink-0 self-center rounded-full border border-brand-gold/40 px-5 py-2.5 text-xs font-bold uppercase tracking-widest text-brand-gold hover:bg-brand-gold hover:text-brand-dark transition-colors text-center"
                                       x-text="$root.lang === 'en' ? 'Write a review' : 'Napisz recenzję'"></a>
                                </div>

                </template>
            </div>
            <div class="flex items-center gap-3 justify-end">
                <button @click="show = false; localStorage.setItem('cookieAccepted', 'true')"
                        class="px-4 py-2 bg-brand-gold text-brand-dark text-xs font-bold uppercase tracking-widest hover:bg-white transition-colors border border-brand-gold">
                    <span x-text="content && content[lang].cookies.accept"></span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
