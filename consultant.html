<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona konsultanta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@300;400;500;600&family=Oswald:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#121212',
                            gold: '#D4AF37',
                            gray: '#2A2A2A',
                            text: '#E0E0E0'
                        }
                    },
                    fontFamily: {
                        serif: ['var(--font-serif)', 'ui-serif', 'Georgia', 'serif'],
                        sans: ['var(--font-sans)', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="js/core/config.js"></script>
    <script defer src="js/core/supabaseClient.js"></script>
    <script defer src="js/templates/registry.js"></script>
    <script defer src="js/core/contentSchema.js"></script>
    <script defer src="js/core/contentUpgrader.js"></script>
    <script defer src="js/core/themeStyling.js"></script>
    <script defer src="js/core/pageRepository.js"></script>
    <script defer src="js/features/publicSiteApp.js"></script>
    <script defer src="js/features/googleReviewsApp.js"></script>
    <script defer src="js/features/cookieConsentApp.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <script src="js/ui/reveal.js" defer></script>
</head>

<body 
    :class="content && content[lang].settings?.darkMode ? 'dark' : ''"
    class="bg-sattva-bg text-sattva-text font-sans antialiased selection:bg-sattva-brand selection:text-sattva-white transition-colors duration-500"
    x-data="createPublicSiteApp('consultant')"
>

    <div x-show="!content" class="fixed inset-0 bg-sattva-bg z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <svg class="animate-spin h-10 w-10 text-sattva-brand mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-sattva-brand font-serif tracking-widest text-sm animate-pulse">DISTILLING ESSENCE...</p>
    </div>

    <div x-show="bazaBlad" x-cloak class="fixed inset-0 bg-sattva-bg z-[100] flex flex-col items-center justify-center text-center px-6">
        <h1 class="text-6xl text-sattva-brand font-serif mb-4">404</h1>
        <p class="text-xl text-sattva-text/80">Nie znaleziono danych dla tej strony.</p>
    </div>

    <template x-if="content">
        <div x-transition.opacity.duration.700ms>
        
        <nav class="fixed w-full z-50 bg-sattva-accent backdrop-blur-md border-b border-sattva-brand/10 py-4 transition-all duration-300">
            <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
                <div class="flex items-center">
                     <template x-if="content[lang].nav?.logoImage">
                        <img :src="content[lang].nav.logoImage" alt="Logo" class="h-8 md:h-12 object-contain">
                     </template>
    
                    <template x-if="!content[lang].nav?.logoImage">
                        <div class="text-lg md:text-xl font-sans font-bold tracking-[0.15em] uppercase text-sattva-text" x-html="content[lang].nav.logo || 'MOJA <span class=\'text-sattva-brand\'>FIRMA</span>'"></div>
                    </template>
                </div>                
                <div class="flex items-center gap-6">
                    <template x-if="content[lang].social?.linkedin">
                        <a :href="content[lang].social.linkedin" target="_blank" rel="noopener noreferrer" class="text-sattva-text/80 hover:text-sattva-brand transition-colors">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                                <rect x="2" y="9" width="4" height="12"></rect>
                                <circle cx="4" cy="4" r="2"></circle>
                            </svg>
                        </a>
                    </template>

                    <template x-if="Object.keys(content).length > 1">
                        <div class="flex items-center gap-6">
                            <div class="h-4 w-px bg-sattva-text/30"></div> 
                            <div class="flex space-x-3 text-xs uppercase tracking-widest">
                                <template x-for="(langKey, index) in Object.keys(content)" :key="langKey">
                                    <div class="flex items-center space-x-3">
                                        <button @click="lang = langKey" :class="lang === langKey ? 'text-sattva-brand font-bold scale-110' : 'text-sattva-text/70 hover:text-sattva-text transition-all'" x-text="langKey"></button>
                                        <span class="text-sattva-text/60" x-show="index < Object.keys(content).length - 1">|</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <a href="#contact" class="hidden md:block text-sm uppercase tracking-widest text-sattva-brand hover:text-sattva-text transition-colors duration-300" x-text="content[lang].nav?.cta"></a>
                </div>
            </div>
        </nav>

       <header class="min-h-screen flex flex-col justify-center items-center text-center px-6 relative overflow-hidden pt-24">
            
            <div class="mb-6 reveal relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-sattva-brand to-sattva-text rounded-full opacity-30 group-hover:opacity-60 blur transition duration-500"></div>
               <template x-if="content[lang].hero?.image">
                    <img 
                        :src="content[lang].hero.image" 
                        alt="Zdjęcie profilowe" 
                        class="relative w-40 h-40 md:w-48 md:h-48 object-cover object-top rounded-full border-2 border-sattva-brand/30 grayscale hover:grayscale-0 transition-all duration-700 shadow-2xl"
                    >
               </template>
               <template x-if="!content[lang].hero?.image">
                    <div class="relative w-40 h-40 md:w-48 md:h-48 rounded-full border-2 border-sattva-brand/30 bg-sattva-accent/50 flex items-center justify-center shadow-2xl">
                        <span class="text-sattva-brand font-serif text-3xl tracking-widest" x-text="(content[lang].hero?.name || 'JA').trim().slice(0,2).toUpperCase()"></span>
                    </div>
               </template>
            </div>

            <h3 class="font-serif text-xl md:text-2xl text-sattva-brand tracking-widest uppercase mb-6 reveal delay-100" x-text="content[lang].hero.name"></h3>

            <h1 class="font-serif text-4xl md:text-6xl lg:text-7xl leading-tight text-sattva-text max-w-4xl mb-6 reveal delay-200" x-html="content[lang].hero.headline"></h1>
            <p class="font-serif text-xl md:text-2xl text-sattva-text/80 mb-4 reveal delay-300" x-text="content[lang].hero.subheadline"></p>
            <p class="max-w-2xl text-base md:text-lg text-sattva-text/80 mb-10 font-light reveal delay-500" x-text="content[lang].hero.description"></p>
            
            <a href="#contact" class="group relative px-8 py-3 border border-sattva-brand text-sattva-brand font-serif text-lg tracking-wide hover:bg-sattva-brand hover:text-sattva-white transition-all duration-300 reveal delay-500" x-text="content[lang].hero.button"></a>
        </header>

 <section class="py-24 px-6 bg-sattva-accent" x-show="content[lang].settings?.showManifesto !== false">
    <div class="max-w-3xl mx-auto reveal">
        
        <div class="text-center mb-12">
            <span class="text-xs uppercase tracking-[0.2em] text-sattva-text/70 mb-4 block" x-text="content && content[lang].manifesto?.label"></span>
            <h2 class="text-3xl md:text-4xl text-sattva-text font-bold tracking-tight" x-text="content && content[lang].manifesto?.title"></h2>
            <div class="h-px w-24 bg-sattva-brand mx-auto mt-6"></div>
        </div>

        <div class="px-2 md:px-8">
            <p class="text-lg md:text-xl text-sattva-text/80 leading-relaxed text-left font-light" 
               x-html="content && content[lang].manifesto?.text">
            </p>
        </div>

    </div>
</section>

        <section class="py-24 px-6 relative" x-show="content[lang].settings?.showServices !== false">
            <div class="max-w-6xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <template x-for="(service, index) in content[lang].services">
                        <div class="service-card reveal border border-sattva-text/20 p-8 hover:border-sattva-brand/50 transition-all duration-500 bg-sattva-accent flex flex-col shadow-xl hover:-translate-y-1" :class="'delay-' + (index * 100)">
                            <div class="text-sattva-brand mb-4">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                            </div>
                            <h3 class="font-serif text-2xl text-sattva-text mb-4" x-text="service.title"></h3>
                            <p class="text-sattva-text/80 font-light flex-grow" x-text="service.desc"></p>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <section class="py-24 px-6 bg-sattva-accent" x-show="content[lang].settings?.showProof !== false && content[lang].proof">
            <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-12">
                <div class="md:w-1/2 reveal">
                    <span class="text-xs uppercase tracking-[0.2em] text-sattva-brand mb-2 block" x-text="content[lang].proof?.label"></span>
                    <h2 class="font-serif text-3xl md:text-4xl text-sattva-text mb-6" x-text="content[lang].proof?.title"></h2>
                    <p class="text-sattva-text/80 leading-relaxed mb-6 font-light" x-text="content[lang].proof?.text"></p>
                </div>
                <div class="md:w-1/2 w-full reveal">
                    <div class="bg-sattva-bg p-8 border-l-2 border-sattva-brand shadow-lg">
                        <span class="block text-5xl md:text-6xl font-serif text-sattva-text mb-2" x-text="content[lang].proof?.statNumber"></span>
                        <span class="text-lg text-sattva-brand uppercase tracking-wider mb-4 block" x-text="content[lang].proof?.statLabel"></span>
                        <p class="text-sattva-text/80 text-sm italic" x-text="content[lang].proof?.statDesc"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- FAQ Section -->
        <section class="py-24 px-6 relative" x-show="content[lang].settings?.showFaq !== false && content[lang].faq && content[lang].faq.length > 0">
            <div class="max-w-3xl mx-auto">
                <div class="text-center mb-16 reveal">
                    <span class="text-xs uppercase tracking-[0.2em] text-sattva-brand mb-4 block">Częste pytania</span>
                    <h2 class="text-4xl font-serif text-sattva-text">FAQ / Q&A</h2>
                </div>
                
                <div class="space-y-4">
                    <template x-for="(item, index) in content[lang].faq" :key="index">
                        <div class="reveal border border-sattva-text/20 bg-sattva-accent overflow-hidden shadow-lg" x-data="{ expanded: false }">
                            <button @click="expanded = !expanded" :aria-expanded="expanded" :aria-controls="'faq-answer-' + index" class="w-full px-8 py-6 flex justify-between items-center text-left hover:bg-sattva-text/5 transition-colors">
                                <span class="font-bold text-sattva-text text-lg" x-text="item.question"></span>
                                <svg class="w-5 h-5 text-sattva-brand transform transition-transform duration-300" :class="expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div x-show="expanded" x-collapse x-cloak :id="'faq-answer-' + index">
                                <div class="px-8 pb-6 text-sattva-text/80 leading-relaxed" x-text="item.answer"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="py-24 px-6 bg-sattva-accent" x-show="content[lang].settings?.showReviews !== false && content[lang].reviews && content[lang].reviews.length > 0">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-16 reveal">
                    <span class="text-xs uppercase tracking-[0.2em] text-sattva-brand mb-4 block">Głos Klientów</span>
                    <h2 class="text-4xl font-serif text-sattva-text">Opinie i Współpraca</h2>
                </div>

                <div x-data="{ idx: 0, timer: null, init(){ if ((content[lang].reviews || []).length > 1) { this.timer = setInterval(() => { this.idx = (this.idx + 1) % content[lang].reviews.length }, 4500); } } }"
                     class="relative overflow-hidden">
                    <div class="flex transition-transform duration-700 ease-in-out"
                         :style="`transform: translateX(-${idx * 100}%);`">
                        <template x-for="(review, index) in content[lang].reviews" :key="index">
                            <div class="w-full shrink-0 px-2 md:px-8">
                                <div class="reveal bg-sattva-accent p-8 border border-sattva-text/20 flex flex-col shadow-xl min-h-[290px]">
                                    <div class="mb-6">
                                        <div class="h-16 w-full max-w-[220px] rounded-sm border border-sattva-text/20 bg-sattva-bg flex items-center justify-center overflow-hidden px-3">
                                            <template x-if="review.logoImage">
                                                <img :src="review.logoImage" class="max-h-12 w-full object-contain opacity-95">
                                            </template>
                                            <template x-if="!review.logoImage">
                                                <span class="text-[10px] uppercase tracking-[0.2em] text-sattva-text/60">Logo Klienta</span>
                                            </template>
                                        </div>
                                    </div>
                                    <p class="text-sattva-text/80 font-light italic mb-8 flex-grow text-lg leading-relaxed" x-text="'„' + review.content + '”'"></p>
                                    <div class="flex items-center gap-4">
                                        <div class="h-px w-8 bg-sattva-brand"></div>
                                        <span class="text-sm font-bold uppercase tracking-widest text-sattva-text" x-text="review.author"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="flex justify-center mt-6 gap-2" x-show="(content[lang].reviews || []).length > 1">
                        <template x-for="(dot, dotIndex) in content[lang].reviews" :key="dotIndex">
                            <button class="w-2.5 h-2.5 rounded-full transition-colors"
                                    :class="idx === dotIndex ? 'bg-sattva-brand' : 'bg-sattva-text/30'"
                                    @click="idx = dotIndex"></button>
                        </template>
                    </div>
                </div>
            </div>
        </section>

        <!-- Google Reviews (Zaufanie) — nad kontaktem, karuzela -->
        <template x-if="content[lang].google_reviews?.place_query">
            <section class="py-24 px-4 sm:px-6 bg-sattva-accent overflow-hidden">
                <div class="max-w-5xl mx-auto">
                    <div class="text-center mb-10 reveal">
                        <span class="text-xs uppercase tracking-[0.2em] text-sattva-brand mb-4 block">Zaufanie</span>
                        <h2 class="text-4xl font-serif text-sattva-text" x-text="content[lang].google_reviews?.title || 'Opinie z Google'"></h2>
                    </div>

                    <div
                        x-data="googleReviews()"
                        class="reveal"
                    >
                        <template x-if="loading">
                            <div class="bg-sattva-accent border border-sattva-text/20 rounded-full sm:rounded-2xl shadow-xl p-8 text-center">
                                <div class="text-sattva-text/80 text-sm font-bold">Ładowanie opinii z Google…</div>
                            </div>
                        </template>

                        <template x-if="!loading && reviews.length">
                            <div class="space-y-8">
                                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 px-5 sm:px-8 py-4 rounded-full border border-sattva-brand/30 bg-sattva-accent shadow-lg backdrop-blur-sm">
                                    <div class="flex flex-wrap items-center gap-3 sm:gap-4 justify-center sm:justify-start">
                                        <svg class="h-7 w-7 shrink-0" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.666 32.657 29.234 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.222 0-9.673-3.453-11.284-8.091l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
                                        <span class="text-sm font-semibold text-sattva-text tracking-wide" x-text="$root.lang === 'en' ? 'Google reviews' : 'Opinie Google'"></span>
                                        <div class="flex items-center gap-1 text-sattva-brand text-base leading-none" aria-hidden="true">
                                            <template x-for="si in [1,2,3,4,5]" :key="'h'+si">
                                                <span x-text="si <= Math.round(headerRating() || 0) ? '★' : '☆'"></span>
                                            </template>
                                        </div>
                                        <span class="text-sm font-bold text-sattva-text tabular-nums" x-text="headerRating() != null ? Number(headerRating()).toFixed(1) : '—'"></span>
                                        <span class="text-sattva-text/60">|</span>
                                        <span class="text-sm text-sattva-text/80" x-text="displayCount() + ' ' + ($root.lang === 'en' ? 'reviews' : 'opinii')"></span>
                                    </div>
                                    <a :href="writeReviewUrl()" target="_blank" rel="noopener noreferrer"
                                       class="shrink-0 self-center rounded-full border border-sattva-brand/40 px-5 py-2.5 text-xs font-bold uppercase tracking-widest text-sattva-brand hover:bg-sattva-brand hover:text-sattva-white transition-colors text-center"
                                       x-text="$root.lang === 'en' ? 'Write a review' : 'Napisz recenzję'"></a>
                                </div>

                                <div class="relative flex items-stretch gap-3 md:gap-4">
                                    <button type="button" @click="prevSlide()"
                                            class="hidden sm:flex shrink-0 w-11 h-11 rounded-full border border-sattva-text/20 bg-sattva-accent text-sattva-text items-center justify-center hover:border-sattva-brand/50 transition-colors self-center shadow-lg"
                                            :class="slide === 0 ? 'opacity-40 pointer-events-none' : ''"
                                            aria-label="Poprzednia opinia">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                                    </button>

                                    <div class="flex-1 min-w-0 overflow-hidden rounded-2xl">
                                        <div class="flex transition-transform duration-500 ease-out"
                                             :style="'transform: translateX(-' + (slide * 100) + '%)'">
                                            <template x-for="(r, i) in reviews" :key="i">
                                                <div class="w-full shrink-0 px-1 sm:px-2 box-border">
                                                    <div x-data="{ expanded: false }"
                                                         class="relative min-h-[260px] bg-sattva-accent border border-sattva-text/20 p-6 md:p-8 shadow-xl flex flex-col">
                                                        <div class="flex items-start justify-between gap-3 mb-4">
                                                            <div class="flex items-center gap-3 min-w-0">
                                                                <template x-if="r.profile_photo_url">
                                                                    <img :src="r.profile_photo_url" :alt="(r.author_name || 'Klient') + ' - zdjęcie profilowe'" class="w-12 h-12 rounded-full object-cover ring-2 ring-sattva-brand/20" loading="lazy">
                                                                </template>
                                                                <template x-if="!r.profile_photo_url">
                                                                    <div class="w-12 h-12 rounded-full bg-sattva-brand/20 flex items-center justify-center text-sattva-brand font-bold text-lg shrink-0"
                                                                         x-text="(r.author_name || '?').charAt(0).toUpperCase()"></div>
                                                                </template>
                                                                <div class="min-w-0">
                                                                    <div class="font-bold text-sattva-text truncate" x-text="r.author_name || 'Klient'"></div>
                                                                    <div class="text-xs text-sattva-text/70" x-text="formatRel(r.publishTime, $root.lang)"></div>
                                                                </div>
                                                            </div>
                                                            <div class="text-sm font-bold text-sattva-brand shrink-0" x-text="r.rating ? (Number(r.rating).toFixed(1) + '★') : ''"></div>
                                                        </div>
                                                        <div class="flex items-center gap-2 mb-3">
                                                            <div class="flex text-sattva-brand text-sm leading-none gap-0.5">
                                                                <template x-for="si in [1,2,3,4,5]" :key="'s'+si">
                                                                    <span x-text="si <= Math.round(Number(r.rating) || 0) ? '★' : '☆'"></span>
                                                                </template>
                                                            </div>
                                                        </div>
                                                        <p class="text-sattva-text/80 text-sm leading-relaxed flex-grow italic"
                                                           :class="expanded ? '' : 'line-clamp-4'"
                                                           x-text="r.text"></p>
                                                        <button type="button" class="mt-4 text-left text-xs font-bold uppercase tracking-widest text-sattva-brand/80 hover:text-sattva-brand transition-colors"
                                                                @click="expanded = !expanded"
                                                                x-show="r.text && r.text.length > 180"
                                                                x-text="expanded ? ($root.lang === 'en' ? 'Show less' : 'Zwiń') : ($root.lang === 'en' ? 'Read more' : 'Czytaj więcej')"></button>

       class="fixed bottom-4 right-4 z-[100] bg-black/80 text-white text-xs font-sans px-4 py-2 rounded-full shadow-2xl backdrop-blur-md hover:bg-black transition-colors border border-white/10 flex items-center gap-2">
        <span>⚡ Zbudowano w DFCMS</span>
    </a>

    <div x-show="activeModal" x-cloak x-transition.opacity
         class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
         role="dialog" aria-modal="true" :aria-label="activeModal === 'privacy' ? 'Polityka Prywatności' : 'Regulamin'">
        <div @click.self="closeModal()" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative bg-white text-gray-900 rounded-lg shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between p-4 border-b border-gray-200 shrink-0">
                <h2 class="text-xl font-serif font-bold" x-text="activeModal === 'privacy' ? 'Polityka Prywatności' : 'Regulamin'"></h2>
                <button @click="closeModal()" class="p-2 text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded-full transition-colors" aria-label="Zamknij">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="overflow-y-auto p-6 text-gray-700 leading-relaxed space-y-4 [&_h2]:text-xl [&_h2]:font-serif [&_h2]:text-sattva-brand [&_h2]:mt-6 [&_a]:text-sattva-brand [&_a]:underline"
                 x-html="activeModal === 'privacy' ? (content[lang]?.legal?.privacy_policy || '') : (content[lang]?.legal?.terms || '')"></div>
        </div>
    </div>
</body>
</html>
