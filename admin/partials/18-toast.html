    <div x-show="toast && toast.show"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-4"
         class="fixed bottom-4 right-4 z-[400] px-6 py-3 rounded-lg shadow-2xl flex items-center gap-3"
         :class="toast.type === 'error' ? 'bg-red-600 text-white' : toast.type === 'info' ? 'bg-sky-800 text-white' : 'bg-emerald-600 text-white'">

        <svg x-show="toast.type === 'error'" class="w-5 h-5 text-red-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>

        <svg x-show="toast.type === 'info'" x-cloak class="w-5 h-5 text-sky-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>

        <svg x-show="toast.type === 'success'" class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        </svg>

        <span class="font-medium text-sm" x-text="toast.message"></span>
    </div>
