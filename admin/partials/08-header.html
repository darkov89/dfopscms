        <header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/90 shadow-sm backdrop-blur-md">
            <div class="mx-auto flex min-h-16 w-full max-w-[1600px] flex-col items-stretch gap-2 px-4 py-3 md:min-h-16 md:flex-row md:items-center md:justify-between md:gap-6 md:px-8 md:py-0 xl:px-10">
                <div class="flex min-w-0 flex-1 items-center gap-3 text-sm text-slate-700 md:gap-5">
                    <button type="button" @click="mobileMenuOpen = !mobileMenuOpen" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-xl leading-none text-slate-700 shadow-sm transition-colors hover:bg-slate-50 hover:text-slate-950 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2 md:hidden" :aria-expanded="mobileMenuOpen ? 'true' : 'false'" aria-controls="dfops-admin-sidebar" aria-label="Otwórz menu">
                        ☰
                    </button>
                    <div class="hidden h-8 shrink-0 items-center border-r border-slate-200/90 pr-5 md:flex" aria-hidden="false">
                        <button type="button" @click="setTab('dashboard')" class="text-sm font-semibold tracking-[0.18em] text-slate-900 transition-colors hover:text-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2">DF<span class="text-accent">CMS</span></button>
                    </div>
                        <div class="flex min-w-0 flex-1 flex-wrap items-center gap-x-3 gap-y-1.5 leading-snug md:flex-nowrap md:items-center">
                        <div class="flex min-w-0 items-baseline gap-2">
                            <span class="shrink-0 text-slate-500">Szablon</span>
                            <span class="truncate font-medium text-slate-900" x-text="themeDisplayLabel"></span>
                        </div>
                        <span class="hidden h-3.5 w-px shrink-0 self-center bg-slate-200 sm:block" aria-hidden="true"></span>
                        <div x-show="typeof i18nEnabledLocales === 'function' && i18nEnabledLocales().length > 1" class="flex items-center gap-1.5" x-cloak>
                            <span class="shrink-0 text-slate-500 text-xs">Język</span>
                            <template x-for="loc in i18nEnabledLocales()" :key="'edit-loc-'+loc">
                                <button type="button" @click="setEditLocale(loc)"
                                        class="rounded-md px-2 py-1 text-xs font-semibold transition-colors"
                                        :class="editLocale === loc ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                                        x-text="i18nLocaleLabel(loc)"></button>
                            </template>
                            <span class="hidden sm:inline text-[10px] font-semibold uppercase tracking-wider text-slate-400 ml-1"
                                  x-text="i18nTranslationMode() === 'ai' ? 'AI sync' : 'ręcznie'"
                                  :title="i18nTranslationMode() === 'ai' ? 'Po zmianach w PL zapytamy o aktualizację innych języków' : 'Każdy język edytujesz osobno'"></span>
                        </div>
                        <span class="hidden h-3.5 w-px shrink-0 self-center bg-slate-200 sm:block" aria-hidden="true"></span>
                        <div x-show="showOwnedPagesSelector" x-cloak class="flex min-w-0 items-center gap-1.5">
                            <span class="shrink-0 text-slate-500 text-xs">Strona</span>
                            <select
                                class="max-w-[10rem] truncate rounded-md border border-slate-200 bg-white px-2 py-1 text-xs font-semibold text-slate-800 shadow-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/30 sm:max-w-[14rem]"
                                :value="pageId"
                                @change="switchOwnedPage($event.target.value)"
                                aria-label="Wybierz stronę">
                                <template x-for="p in ownedPages" :key="'owned-'+p.id">
                                    <option :value="p.id" :selected="String(p.id) === String(pageId)" x-text="p.slug"></option>
                                </template>
                            </select>
                        </div>
                        <span x-show="showOwnedPagesSelector" x-cloak class="hidden h-3.5 w-px shrink-0 self-center bg-slate-200 sm:block" aria-hidden="true"></span>
                        <a :href="getLiveSiteUrl()"
                           target="_blank" rel="noopener noreferrer"
                           class="group inline-flex min-w-0 items-center gap-1 truncate font-medium text-slate-900 underline decoration-slate-200 underline-offset-4 hover:decoration-slate-400"
                           :title="liveSiteLinkTitle">
                            <span class="min-w-0 truncate" x-text="slug"></span>
                            <span x-show="isTrialPublicBlocked" x-cloak class="shrink-0 text-[10px] font-bold uppercase tracking-wider text-red-700" title="Zablokowane dla gości">live ✕</span>
                            <span class="shrink-0 text-slate-400 transition-colors group-hover:text-slate-600" aria-hidden="true">↗</span>
                        </a>
                    </div>
                </div>

                <div class="flex w-full min-w-0 flex-col gap-1.5 md:w-auto md:max-w-none md:shrink-0 md:items-end">
                    <div class="flex w-full min-w-0 items-center justify-end gap-2 sm:gap-3">
                        <a id="dfcms-onboarding-site-preview"
                           :href="getPublicSiteUrl()"
                           @click="stashDraftForPreview()"
                           :title="previewSiteButtonTitle"
                           target="_blank" rel="noopener noreferrer"
                           class="inline-flex min-w-0 items-center justify-center rounded-lg border px-3 py-2.5 text-sm font-medium shadow-sm transition-colors sm:px-4"
                           :class="isTrialPublicBlocked ? 'border-amber-300 bg-amber-50 text-amber-950 hover:bg-amber-100' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:text-slate-900'">
                            <span x-text="previewSiteButtonLabel"></span>
                        </a>

                        <button @click="requestPublish()" x-show="content && panelContentReady" type="button"
                                :disabled="saving"
                                :title="isPublishBlockedByPlan ? 'Publikacja tego motywu wymaga planu Premium' : 'Skopiuj stan roboczy do wersji publicznej (na żywo)'"
                                class="inline-flex min-w-0 shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-lg border border-accent bg-accent px-4 py-2.5 text-sm font-bold text-accent-fg shadow-panel transition-colors hover:bg-accent/90 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/40 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:px-6">
                            <span x-show="isPublishBlockedByPlan" x-cloak aria-hidden="true">🔒</span>
                            <span x-show="!saving">Opublikuj zmiany</span>
                            <span x-show="saving" x-cloak class="animate-pulse">Zapisywanie…</span>
                        </button>

                        <div class="relative shrink-0" x-data="{ open: false }" @click.outside="open = false">
                            <button type="button"
                                    @click="open = !open"
                                    class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm transition-colors hover:bg-slate-50 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2"
                                    :aria-expanded="open ? 'true' : 'false'"
                                    aria-label="Więcej opcji">
                                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/></svg>
                            </button>
                            <div x-show="open" x-cloak x-transition.opacity class="absolute right-0 top-full z-50 mt-1 min-w-[11rem] rounded-xl border border-slate-200/90 bg-white py-1 shadow-panel-md ring-1 ring-slate-900/5">
                                <p class="px-3 py-2 text-[11px] text-slate-400 truncate border-b border-slate-100" x-text="user?.email" title="Zalogowany użytkownik"></p>
                                <button type="button" @click="revertChanges(); open = false" x-show="content && panelContentReady" :disabled="saving"
                                        class="block w-full px-3 py-2.5 text-left text-sm text-slate-700 transition-colors hover:bg-slate-50 disabled:opacity-50">
                                    Odrzuć zmiany
                                </button>
                                <button type="button" @click="setTab('subscription'); open = false; $nextTick(() => { const el = document.getElementById('dfops-platnosci-info'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); })"
                                        class="block w-full px-3 py-2.5 text-left text-sm text-slate-700 transition-colors hover:bg-slate-50">
                                    Warunki i płatności
                                </button>
                                <button type="button" @click="logout(); open = false"
                                        class="block w-full px-3 py-2.5 text-left text-sm text-red-600 transition-colors hover:bg-red-50">
                                    Wyloguj
                                </button>
                            </div>
                        </div>
                    </div>
                    <p x-show="content && panelContentReady" x-cloak class="text-right text-[11px] leading-snug text-slate-500 max-w-md">
                        Zmiany zapisane — kliknij <strong class="font-semibold text-slate-600">Opublikuj</strong>, żeby były widoczne dla klientów.
                    </p>
                </div>
            </div>
        </header>
