        <header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/95 shadow-sm backdrop-blur-md">
            <div class="mx-auto flex w-full max-w-[1600px] items-center gap-2 px-3 py-2.5 sm:gap-3 sm:px-4 md:min-h-16 md:gap-6 md:px-8 md:py-0 xl:px-10">
                <!-- Lewa: menu + brand + meta -->
                <div class="flex min-w-0 flex-1 items-center gap-2 sm:gap-3 md:gap-5">
                    <button type="button" @click="mobileMenuOpen = !mobileMenuOpen" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-xl leading-none text-slate-700 shadow-sm transition-colors hover:bg-slate-50 hover:text-slate-950 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2 md:hidden" :aria-expanded="mobileMenuOpen ? 'true' : 'false'" aria-controls="dfops-admin-sidebar" aria-label="Otwórz menu">
                        ☰
                    </button>
                    <button type="button" @click="setTab('dashboard')" class="shrink-0 text-sm font-semibold tracking-[0.14em] text-slate-900 transition-colors hover:text-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2 md:border-r md:border-slate-200/90 md:pr-5">
                        DF<span class="text-accent">CMS</span>
                    </button>

                    <div class="hidden min-w-0 flex-1 items-center gap-x-3 gap-y-1 overflow-hidden md:flex md:flex-wrap lg:flex-nowrap">
                        <div class="flex min-w-0 items-baseline gap-2">
                            <span class="shrink-0 text-sm text-slate-500">Szablon</span>
                            <span class="truncate text-sm font-medium text-slate-900" x-text="themeDisplayLabel"></span>
                        </div>
                        <span class="hidden h-3.5 w-px shrink-0 self-center bg-slate-200 sm:block" aria-hidden="true"></span>
                        <div x-show="typeof i18nEnabledLocales === 'function' && i18nEnabledLocales().length > 1" class="flex items-center gap-1.5" x-cloak>
                            <span class="shrink-0 text-xs text-slate-500">Język</span>
                            <template x-for="loc in i18nEnabledLocales()" :key="'edit-loc-'+loc">
                                <button type="button" @click="setEditLocale(loc)"
                                        class="rounded-md px-2 py-1 text-xs font-semibold transition-colors"
                                        :class="editLocale === loc ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                                        x-text="i18nLocaleLabel(loc)"></button>
                            </template>
                        </div>
                        <span class="hidden h-3.5 w-px shrink-0 self-center bg-slate-200 lg:block" aria-hidden="true"></span>
                        <div x-show="showOwnedPagesSelector" x-cloak class="hidden min-w-0 items-center gap-1.5 lg:flex">
                            <span class="shrink-0 text-xs text-slate-500">Strona</span>
                            <select
                                class="max-w-[14rem] truncate rounded-md border border-slate-200 bg-white px-2 py-1 text-xs font-semibold text-slate-800 shadow-sm focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/30"
                                :value="pageId"
                                @change="switchOwnedPage($event.target.value)"
                                aria-label="Wybierz stronę">
                                <template x-for="p in ownedPages" :key="'owned-'+p.id">
                                    <option :value="p.id" :selected="String(p.id) === String(pageId)" x-text="p.slug"></option>
                                </template>
                            </select>
                        </div>
                        <a :href="getLiveSiteUrl()"
                           target="_blank" rel="noopener noreferrer"
                           class="group hidden min-w-0 items-center gap-1 truncate text-sm font-medium text-slate-900 underline decoration-slate-200 underline-offset-4 hover:decoration-slate-400 lg:inline-flex"
                           :title="liveSiteLinkTitle">
                            <span class="min-w-0 truncate" x-text="slug"></span>
                            <span x-show="isTrialPublicBlocked" x-cloak class="shrink-0 text-[10px] font-bold uppercase tracking-wider text-red-700" title="Zablokowane dla gości">live ✕</span>
                            <span class="shrink-0 text-slate-400 transition-colors group-hover:text-slate-600" aria-hidden="true">↗</span>
                        </a>
                    </div>

                    <!-- Mobile: tylko język (kompakt) -->
                    <div x-show="typeof i18nEnabledLocales === 'function' && i18nEnabledLocales().length > 1" class="flex min-w-0 items-center gap-1 overflow-x-auto md:hidden" x-cloak>
                        <template x-for="loc in i18nEnabledLocales()" :key="'m-edit-loc-'+loc">
                            <button type="button" @click="setEditLocale(loc)"
                                    class="shrink-0 rounded-md px-2 py-1 text-[11px] font-semibold uppercase tracking-wide transition-colors"
                                    :class="editLocale === loc ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'"
                                    x-text="i18nLocaleLabel(loc)"></button>
                        </template>
                    </div>
                </div>

                <!-- Prawa: akcje -->
                <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">
                    <a x-show="theme === 'custom'" x-cloak
                       :href="'/studio.html?site=' + encodeURIComponent(slug || '')"
                       title="Otwórz Studio AI dla tej strony"
                       class="inline-flex h-10 items-center justify-center gap-1.5 rounded-lg border border-purple-200 bg-purple-50 px-2.5 text-xs font-semibold text-purple-900 shadow-sm transition-colors hover:bg-purple-100 sm:px-3 sm:text-sm">
                        <span aria-hidden="true">✨</span>
                        <span class="hidden sm:inline">Studio AI</span>
                    </a>

                    <a id="dfcms-onboarding-site-preview"
                       :href="getPublicSiteUrl()"
                       @click="stashDraftForPreview()"
                       :title="previewSiteButtonTitle"
                       target="_blank" rel="noopener noreferrer"
                       class="inline-flex h-10 items-center justify-center rounded-lg border px-2.5 text-xs font-medium shadow-sm transition-colors sm:px-3 sm:text-sm"
                       :class="isTrialPublicBlocked ? 'border-amber-300 bg-amber-50 text-amber-950 hover:bg-amber-100' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:text-slate-900'">
                        <span class="sm:hidden" aria-hidden="true">👁</span>
                        <span class="hidden sm:inline" x-text="previewSiteButtonLabel"></span>
                    </a>

                    <button @click="requestPublish()" x-show="content && panelContentReady" type="button"
                            :disabled="saving"
                            :title="isPublishBlockedByPlan ? 'Publikacja tego motywu wymaga planu Premium' : 'Skopiuj stan roboczy do wersji publicznej (na żywo)'"
                            class="inline-flex h-10 min-w-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-lg border border-accent bg-accent px-3 text-xs font-bold text-accent-fg shadow-panel transition-colors hover:bg-accent/90 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/40 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:px-4 sm:text-sm">
                        <span x-show="isPublishBlockedByPlan" x-cloak aria-hidden="true">🔒</span>
                        <span x-show="!saving">Opublikuj</span>
                        <span x-show="saving" x-cloak class="animate-pulse">…</span>
                    </button>

                    <div class="relative shrink-0" x-data="{ open: false }" @click.outside="open = false">
                        <button type="button"
                                @click="open = !open"
                                class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm transition-colors hover:bg-slate-50 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2"
                                :aria-expanded="open ? 'true' : 'false'"
                                aria-label="Więcej opcji">
                            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/></svg>
                        </button>
                        <div x-show="open" x-cloak x-transition.opacity class="absolute right-0 top-full z-50 mt-1 min-w-[13rem] rounded-xl border border-slate-200/90 bg-white py-1 shadow-panel-md ring-1 ring-slate-900/5">
                            <p class="truncate border-b border-slate-100 px-3 py-2 text-[11px] text-slate-400" x-text="user?.email" title="Zalogowany użytkownik"></p>
                            <div class="border-b border-slate-100 px-3 py-2 md:hidden">
                                <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Szablon</p>
                                <p class="truncate text-sm font-medium text-slate-800" x-text="themeDisplayLabel"></p>
                                <a :href="getLiveSiteUrl()" target="_blank" rel="noopener noreferrer" class="mt-1 inline-flex items-center gap-1 text-xs font-medium text-accent" x-text="slug || 'LIVE'"></a>
                            </div>
                            <div x-show="showOwnedPagesSelector" x-cloak class="border-b border-slate-100 px-3 py-2 lg:hidden">
                                <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-400">Strona</label>
                                <select
                                    class="w-full rounded-md border border-slate-200 bg-white px-2 py-1.5 text-xs font-semibold text-slate-800"
                                    :value="pageId"
                                    @change="switchOwnedPage($event.target.value); open = false"
                                    aria-label="Wybierz stronę">
                                    <template x-for="p in ownedPages" :key="'m-owned-'+p.id">
                                        <option :value="p.id" :selected="String(p.id) === String(pageId)" x-text="p.slug"></option>
                                    </template>
                                </select>
                            </div>
                            <a x-show="theme === 'custom'" x-cloak
                               :href="'/studio.html?site=' + encodeURIComponent(slug || '')"
                               class="block w-full px-3 py-2.5 text-left text-sm font-semibold text-purple-700 transition-colors hover:bg-purple-50">
                                ✨ Otwórz Studio AI
                            </a>
                            <a href="/kreator.html"
                               class="block w-full px-3 py-2.5 text-left text-sm text-slate-700 transition-colors hover:bg-slate-50">
                                Nowa strona filmowa (Studio AI)
                            </a>
                            <button type="button" @click="revertChanges(); open = false" x-show="content && panelContentReady" :disabled="saving"
                                    class="block w-full px-3 py-2.5 text-left text-sm text-slate-700 transition-colors hover:bg-slate-50 border-t border-slate-100">
                                Odrzuć zmiany
                            </button>
                            <button type="button" @click="setTab('subscription'); open = false; $nextTick(() => { const el = document.getElementById('dfops-platnosci-info'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); })"
                                    class="block w-full px-3 py-2.5 text-left text-sm text-slate-700 transition-colors hover:bg-slate-50">
                                Warunki i płatności
                            </button>
                            <button type="button" @click="logout(); open = false"
                                    class="block w-full px-3 py-2.5 text-left text-sm text-red-600 transition-colors hover:bg-red-50">
                                Wyloguj
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div x-show="theme === 'custom'" x-cloak class="border-t border-purple-100 bg-purple-50/90 px-4 py-1.5 text-center text-[11px] sm:text-xs text-purple-900">
                <span>Ta strona jest połączona ze Studio AI.</span>
                <a :href="'/studio.html?site=' + encodeURIComponent(slug || '')" class="ml-1.5 font-semibold text-purple-700 underline hover:text-purple-900">Przejdź do edycji z Agentem AI →</a>
            </div>
            <p x-show="content && panelContentReady && theme !== 'custom'" x-cloak class="hidden border-t border-slate-100 bg-slate-50/80 px-4 py-1.5 text-center text-[11px] leading-snug text-slate-500 md:block">
                Zmiany zapisane — kliknij <strong class="font-semibold text-slate-600">Opublikuj</strong>, żeby były widoczne dla klientów.
            </p>
        </header>
