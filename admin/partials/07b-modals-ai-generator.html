        <!-- AI Site Generator -->
        <div x-show="aiModalOpen" x-cloak class="fixed inset-0 z-[268] flex items-center justify-center p-4 bg-black/55 backdrop-blur-[2px]"
             @click.self="closeAiGeneratorModal()" @keydown.escape.window="aiModalOpen && !isGeneratingAi && closeAiGeneratorModal()"
             role="dialog" aria-modal="true" aria-labelledby="dfcms-ai-gen-title">
            <div class="relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-panel-md ring-1 ring-slate-900/10 sm:p-7" @click.stop>
                <button type="button" class="absolute top-3 right-3 text-slate-400 hover:text-slate-800 text-xl leading-none disabled:opacity-40"
                        @click="closeAiGeneratorModal()" :disabled="isGeneratingAi" aria-label="Zamknij">×</button>
                <p class="text-[10px] font-bold uppercase tracking-[0.28em] text-slate-400 mb-2">AI</p>
                <h2 id="dfcms-ai-gen-title" class="text-lg font-bold text-slate-900 mb-2" x-text="aiMode === 'adapt' ? ('Przetłumacz na ' + (typeof i18nLocaleLabel === 'function' ? i18nLocaleLabel(editLocale || 'en') : 'EN')) : 'Wygeneruj treść przez AI'"></h2>
                <p class="text-sm text-slate-600 leading-relaxed mb-4" x-text="aiMode === 'adapt' ? 'AI przetłumaczy teksty z języka podstawowego do wersji roboczej. Możesz od razu kliknąć przycisk — kontekst poniżej jest opcjonalny.' : ('Opisz swój biznes. AI przygotuje teksty dla języka: ' + (typeof i18nLocaleLabel === 'function' ? i18nLocaleLabel(editLocale || 'pl') : 'PL') + '.')"></p>
                <label for="dfcms-ai-prompt" class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2" x-text="aiMode === 'adapt' ? 'Opcjonalny kontekst (nieobowiązkowy)' : 'Opis biznesu'"></label>
                <textarea id="dfcms-ai-prompt" x-model="aiPrompt" rows="5" maxlength="1500"
                          :disabled="isGeneratingAi"
                          :placeholder="aiMode === 'adapt' ? 'np. formalny ton, skup się na turystach… (możesz zostawić puste)' : 'np. Salon fryzjerski Męski Zacięcie w Katowicach…'"
                          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-800 focus:border-transparent focus:ring-2 focus:ring-accent/30 outline-none resize-y disabled:bg-slate-50 disabled:text-slate-500"></textarea>
                <div class="mt-2 flex items-center justify-between gap-3 text-xs text-slate-500">
                    <span x-show="aiRemaining != null && aiLimit != null" x-cloak
                          x-text="'Pozostało w tym miesiącu: ' + aiRemaining + ' / ' + aiLimit"></span>
                    <span class="ml-auto" x-text="(aiPrompt || '').length + ' / 1500'"></span>
                </div>
                <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row">
                    <button type="button" @click="closeAiGeneratorModal()" :disabled="isGeneratingAi"
                            class="flex-1 rounded-lg border-2 border-slate-200 px-4 py-3 text-sm font-semibold text-slate-800 transition-colors hover:border-slate-300 hover:bg-slate-50/80 disabled:opacity-50">
                        Anuluj
                    </button>
                    <button type="button" @click="generateSiteWithAi()"
                            :disabled="isGeneratingAi || (aiMode !== 'adapt' && !(aiPrompt || '').trim())"
                            class="flex-1 inline-flex items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-3 text-sm font-bold text-white shadow-sm transition-colors hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60">
                        <svg x-show="isGeneratingAi" class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg>
                        <span x-text="isGeneratingAi ? (aiMode === 'adapt' ? 'Tłumaczę…' : 'Generowanie…') : (aiMode === 'adapt' ? 'Przetłumacz teraz' : 'Generuj stronę')"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Globalny progress AI (dodawanie języka / sync bez modala) -->
        <div x-show="isGeneratingAi && !aiModalOpen" x-cloak
             class="fixed inset-0 z-[269] flex items-center justify-center p-4 bg-black/50 backdrop-blur-[2px]"
             role="status" aria-live="polite" aria-busy="true">
            <div class="w-full max-w-sm rounded-2xl bg-white p-7 text-center shadow-panel-md ring-1 ring-slate-900/10">
                <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-slate-900 text-white">
                    <svg class="h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                </div>
                <p class="text-base font-bold text-slate-900" x-text="aiProgressLabel || 'AI pracuje…'"></p>
                <p class="mt-2 text-sm text-slate-600 leading-relaxed">Nie zamykaj tej karty. Po zakończeniu sprawdzisz Podgląd i opublikujesz zmiany.</p>
            </div>
        </div>
