                    <div x-show="activeTab === 'menu' && adminTabVisible('menu')" x-transition.opacity x-cloak x-init="ensureMenuContentShape()">
                        <div class="rounded-xl border border-slate-200/70 bg-white p-6 mb-6 shadow-panel ring-1 ring-slate-900/5">
                            <h2 class="font-serif text-2xl tracking-tight text-slate-900 mb-2">Karta dań / Cennik</h2>
                            <p class="text-sm text-slate-600 leading-relaxed max-w-2xl mb-6">Wybierz, jak chcesz pokazać menu na stronie — link, zdjęcie lub wpisane pozycje.</p>
                            <div class="space-y-3">
                                <label class="flex items-center gap-3 cursor-pointer rounded-lg border border-slate-200 px-4 py-3 hover:bg-slate-50">
                                    <input type="radio" value="link" x-model="content.pl.menu_mode" class="text-accent focus:ring-accent/30">
                                    <span class="text-sm text-slate-800">Dodaj odnośnik do swojego menu online</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer rounded-lg border border-slate-200 px-4 py-3 hover:bg-slate-50">
                                    <input type="radio" value="image" x-model="content.pl.menu_mode" class="text-accent focus:ring-accent/30">
                                    <span class="text-sm text-slate-800">Wgraj zdjęcie lub kod QR menu</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer rounded-lg border border-slate-200 px-4 py-3 hover:bg-slate-50">
                                    <input type="radio" value="manual" x-model="content.pl.menu_mode" class="text-accent focus:ring-accent/30">
                                    <span class="text-sm text-slate-800">Wpisz pozycje ręcznie na stronie</span>
                                </label>
                            </div>
                        </div>

                        <div x-show="content.pl.menu_mode === 'link'" class="rounded-xl border border-slate-200/70 bg-white p-6 mb-6 shadow-panel ring-1 ring-slate-900/5">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Adres strony z menu</label>
                            <input type="text" x-model="content.pl.menu_link" placeholder="np. https://twoja-restauracja.pl/menu" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-accent/30">
                            <p class="text-xs text-slate-500 mt-2">Goście przejdą pod ten adres po kliknięciu przycisku na stronie.</p>
                        </div>

                        <div x-show="content.pl.menu_mode === 'image'" class="rounded-xl border border-slate-200/70 bg-white p-6 mb-6 shadow-panel ring-1 ring-slate-900/5">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Wybierz plik ze zdjęciem swojego menu</label>
                            <div class="flex flex-wrap items-start gap-6">
                                <div class="w-32 h-40 rounded-lg border-2 border-dashed border-slate-200 flex items-center justify-center overflow-hidden bg-slate-50">
                                    <template x-if="content.pl.menu_image"><img :src="content.pl.menu_image" class="w-full h-full object-contain" alt=""></template>
                                    <template x-if="!content.pl.menu_image"><span class="text-[10px] text-slate-400 text-center px-2">Brak pliku</span></template>
                                </div>
                                <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-accent/35 bg-amber-50/80 px-4 py-2.5 text-xs font-semibold text-accent-soft hover:bg-amber-50">
                                    Wybierz plik
                                    <input type="file" accept="image/*" class="sr-only" @change="uploadImage($event, 'menu', 'menu_image')">
                                </label>
                            </div>
                            <p x-show="uploadingImage" x-text="uploadingMessage" class="text-xs text-accent mt-2 font-bold animate-pulse"></p>
                        </div>

                        <div x-show="content.pl.menu_mode === 'manual'" class="space-y-6">
                            <template x-for="(item, index) in (content.pl.menu_items || [])" :key="'menu-'+index">
                                <div class="bg-gray-50 p-6 rounded-lg border relative">
                                    <button type="button" @click="content.pl.menu_items.splice(index, 1)" class="absolute top-4 right-4 text-red-400 hover:text-red-600 text-xs font-medium">Usuń</button>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pr-12">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Kategoria</label>
                                            <input type="text" x-model="item.category" placeholder="np. Dania główne" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm bg-white focus:ring-2 focus:ring-accent/30 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Nazwa dania</label>
                                            <input type="text" x-model="item.name" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm font-bold bg-white focus:ring-2 focus:ring-accent/30 outline-none">
                                        </div>
                                        <div class="md:col-span-2">
                                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Składniki / krótki opis</label>
                                            <input type="text" x-model="item.ingredients" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm bg-white focus:ring-2 focus:ring-accent/30 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Cena</label>
                                            <input type="text" x-model="item.price" placeholder="np. 42 zł" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm font-bold text-accent-soft bg-white focus:ring-2 focus:ring-accent/30 outline-none">
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <button type="button" @click="addMenuItemRow()" class="w-full border-2 border-dashed border-gray-300 text-slate-600 font-semibold text-sm py-4 rounded-sm hover:bg-[#D4AF37] hover:text-white hover:border-[#D4AF37] transition-all">
                                + Dodaj pozycję do karty dań
                            </button>
                        </div>

                        <div x-show="themeHasSection('opening_hours')" class="mt-8 rounded-xl border border-slate-200/70 bg-white p-6 shadow-panel ring-1 ring-slate-900/5">
                            <h3 class="text-sm font-bold text-slate-900 mb-4">Godziny otwarcia</h3>
                            <div class="mb-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Nagłówek sekcji</label>
                                <input type="text" x-model="content.pl.hours.title" class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-accent/30">
                            </div>
                            <template x-for="(line, hi) in (content.pl.hours?.lines || [])" :key="'hr-'+hi">
                                <div class="flex gap-2 mb-2">
                                    <input type="text" x-model="content.pl.hours.lines[hi]" placeholder="np. Wt–Nd: 12:00 — 22:00" class="flex-1 rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-accent/30">
                                    <button type="button" @click="content.pl.hours.lines.splice(hi, 1)" class="text-red-400 text-xs font-bold px-2">Usuń</button>
                                </div>
                            </template>
                            <button type="button" @click="addMenuHourLine()" class="mt-2 text-xs font-bold uppercase tracking-widest text-accent hover:underline">+ Dodaj wiersz godzin</button>
                        </div>

                        <div x-show="themeHasSection('orders')" class="mt-8 rounded-xl border border-slate-200/70 bg-white p-6 shadow-panel ring-1 ring-slate-900/5 space-y-4">
                            <h3 class="text-sm font-bold text-slate-900">Zamówienia i rezerwacje</h3>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Mały nagłówek nad sekcją</label>
                                <input type="text" x-model="content.pl.orders.label" class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-accent/30">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Tytuł</label>
                                <input type="text" x-model="content.pl.orders.title" class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-accent/30">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Opis</label>
                                <textarea x-model="content.pl.orders.description" rows="3" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-accent/30 resize-y"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Tekst na przycisku telefonu</label>
                                <input type="text" x-model="content.pl.orders.call_button" class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-accent/30">
                            </div>
                        </div>
                    </div>
