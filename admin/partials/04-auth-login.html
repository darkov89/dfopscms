    <div x-show="!user && !loadingAuth" class="flex flex-grow items-center justify-center p-4 sm:p-6" x-transition>
        <div class="w-full max-w-md rounded-2xl border border-slate-200/70 bg-white p-8 shadow-panel-md ring-1 ring-slate-900/5 sm:p-10">
            <h1 class="mb-2 text-center text-3xl font-black tracking-widest text-slate-900">DF<span class="text-accent">CMS</span></h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest text-center mb-8">Witaj z powrotem!</p>

            <form x-show="!showLoginForgotPassword" @submit.prevent.stop="login($event)" class="space-y-6">
                <div>
                    <label for="admin-email" class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Adres E-mail</label>
                    <input id="admin-email" type="email" x-model="email" required class="w-full rounded-lg border border-slate-200 px-4 py-3 focus:border-transparent focus:ring-2 focus:ring-accent/30 transition-all outline-none">
                </div>
                <div>
                    <label for="admin-password" class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Hasło</label>
                    <input id="admin-password" type="password" x-model="password" required class="w-full rounded-lg border border-slate-200 px-4 py-3 focus:border-transparent focus:ring-2 focus:ring-accent/30 transition-all outline-none">
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" x-model="rememberMe" class="rounded border-slate-300 text-accent focus:ring-accent/40">
                        <span class="text-sm text-slate-500">Zapamiętaj mnie na tym urządzeniu</span>
                    </label>
                    <button type="button" @click="showLoginForgotPassword = true; forgotPasswordEmail = email; authError = ''; forgotPasswordInfo = ''" class="text-sm font-semibold text-accent-soft underline decoration-accent/30 underline-offset-2 hover:text-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 rounded">
                        Nie pamiętam hasła
                    </button>
                </div>

                <div x-show="authError" class="text-red-500 text-sm font-bold text-center" x-text="authError"></div>

                <button type="submit" class="w-full rounded-lg bg-accent-fg px-8 py-4 text-sm font-bold uppercase tracking-widest text-white shadow-panel transition-all duration-200 hover:bg-accent hover:text-accent-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/50 focus-visible:ring-offset-2">
                    Zaloguj się
                </button>
            </form>

            <nav x-show="!showLoginForgotPassword" aria-label="Powiązane strony" class="mt-10 flex flex-col items-center gap-3 text-center sm:flex-row sm:flex-wrap sm:justify-center sm:gap-x-8 sm:gap-y-2">
                <a href="rejestracja.html" class="text-sm text-slate-500 transition-colors duration-200 hover:text-[#D4AF37] focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2 rounded-sm">
                    Nie masz jeszcze konta? Załóż je za darmo
                </a>
                <a href="index.html" class="inline-flex items-center justify-center gap-1.5 text-sm text-slate-500 transition-colors duration-200 hover:text-[#D4AF37] focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2 rounded-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4 shrink-0 opacity-90" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                    Wróć na stronę główną
                </a>
            </nav>

            <div x-show="showLoginForgotPassword" x-cloak class="space-y-6">
                <p class="text-sm text-slate-600 leading-relaxed">Podaj adres konta — wyślemy link do ustawienia nowego hasła (sprawdź także folder spam).</p>
                <form @submit.prevent.stop="requestPasswordReset($event)" class="space-y-4">
                    <div>
                        <label for="admin-forgot-email" class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Adres e-mail</label>
                        <input id="admin-forgot-email" type="email" x-model="forgotPasswordEmail" required autocomplete="email" class="w-full rounded-lg border border-slate-200 px-4 py-3 focus:border-transparent focus:ring-2 focus:ring-accent/30 transition-all outline-none">
                    </div>
                    <div x-show="forgotPasswordInfo" class="text-sm text-emerald-700 font-medium leading-relaxed" x-text="forgotPasswordInfo"></div>
                    <div x-show="authError && showLoginForgotPassword" class="text-red-500 text-sm font-bold text-center" x-text="authError"></div>
                    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <button type="button" @click="showLoginForgotPassword = false; authError = ''; forgotPasswordInfo = ''" class="text-sm font-semibold text-slate-500 hover:text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400/40 rounded px-1">
                            ← Wróć do logowania
                        </button>
                        <button type="submit" :disabled="forgotPasswordSending" class="w-full sm:w-auto rounded-lg bg-accent-fg px-6 py-3.5 text-xs font-bold uppercase tracking-widest text-white shadow-panel transition-colors hover:bg-accent hover:text-accent-fg focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/50 disabled:opacity-50 disabled:cursor-not-allowed">
                            <span x-show="!forgotPasswordSending">Wyślij link resetujący</span>
                            <span x-show="forgotPasswordSending" x-cloak>Wysyłam…</span>
                        </button>
                    </div>
                </form>

                <nav aria-label="Powiązane strony" class="mt-10 flex flex-col items-center gap-3 text-center sm:flex-row sm:flex-wrap sm:justify-center sm:gap-x-8 sm:gap-y-2">
                    <a href="rejestracja.html" class="text-sm text-slate-500 transition-colors duration-200 hover:text-[#D4AF37] focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2 rounded-sm">
                        Nie masz jeszcze konta? Załóż je za darmo
                    </a>
                    <a href="index.html" class="inline-flex items-center justify-center gap-1.5 text-sm text-slate-500 transition-colors duration-200 hover:text-[#D4AF37] focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/35 focus-visible:ring-offset-2 rounded-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4 shrink-0 opacity-90" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                        </svg>
                        Wróć na stronę główną
                    </a>
                </nav>
            </div>
            <p class="text-center text-xs text-slate-500 mt-8 pt-6 border-t border-slate-200/80 leading-relaxed">
                Pomoc / support:
                <a :href="supportMailtoHref()" class="font-semibold text-accent-soft underline decoration-accent/30 underline-offset-2 hover:text-accent" x-text="supportEmailDisplay()"></a>
            </p>
        </div>
    </div>

    <div x-show="loadingAuth" class="flex-grow flex items-center justify-center">
        <p class="text-slate-500 tracking-widest text-sm animate-pulse">Weryfikacja tożsamości...</p>
    </div>
