    <div x-show="user && isForcedPasswordReset" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center bg-[#f8f9fa] p-4">
        <div class="bg-white p-8 max-w-md w-full border border-gray-200 rounded-sm shadow-xl text-center">
            <div class="mb-6 flex justify-center">
                <svg class="w-12 h-12 text-[#D4AF37]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 uppercase tracking-widest mb-2">Bezpieczeństwo konta</h2>
            <p class="text-sm text-gray-500 mb-6">Otwarto sesję z linku odzyskiwania hasła. Ustaw nowe hasło — potem wylogujemy Cię i poprosimy o ponowne zalogowanie do panelu.</p>
            <p class="text-xs text-gray-400 mb-6 text-left leading-relaxed">Wymagania: min. <strong class="text-gray-600">8 znaków</strong>, co najmniej <strong class="text-gray-600">jedna litera</strong> i <strong class="text-gray-600">jedna cyfra</strong>.</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-1" for="dfops-forced-password">Nowe hasło</label>
                    <input id="dfops-forced-password" type="password"
                           x-model="newPassword"
                           placeholder="Min. 8 znaków, litera i cyfra"
                           autocomplete="new-password"
                           class="w-full border border-gray-300 rounded-sm px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-1" for="dfops-forced-password-2">Potwierdź hasło</label>
                    <input id="dfops-forced-password-2" type="password"
                           x-model="newPasswordConfirm"
                           placeholder="Powtórz to samo hasło"
                           autocomplete="new-password"
                           class="w-full border border-gray-300 rounded-sm px-4 py-3 text-sm focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent outline-none transition-all">
                </div>
                <p x-show="forcedResetPasswordHint" x-cloak class="text-xs font-medium leading-snug"
                   :class="forcedResetPasswordHintClass"
                   x-text="forcedResetPasswordHint"></p>

                <button type="button" @click="updatePassword()"
                        :disabled="isPasswordUpdating || !canSubmitForcedPasswordReset"
                        class="w-full bg-[#121212] hover:bg-[#D4AF37] text-white px-6 py-3 rounded-sm text-sm font-bold uppercase tracking-widest transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <span x-show="!isPasswordUpdating">Zapisz hasło</span>
                    <span x-show="isPasswordUpdating" x-cloak class="animate-pulse">Zapisywanie...</span>
                </button>
            </div>
            <div class="mt-6 space-y-3">
                <p class="text-xs text-gray-500">
                    Pomoc:
                    <a :href="supportMailtoHref()" class="font-semibold text-[#9a7b16] underline hover:text-gray-900" x-text="supportEmailDisplay()"></a>
                </p>
                <button type="button" @click="logout()" class="text-xs text-gray-500 hover:text-gray-900 underline">Anuluj i wyloguj mnie</button>
            </div>
        </div>
    </div>
